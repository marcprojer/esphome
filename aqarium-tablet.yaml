esphome:
  name: aquarium-display
  friendly_name: Aquarium Display

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret aquarium_display_api_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Display-SPI (nur für die Init-Befehle des ST7701S)
spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  sda: GPIO19
  scl: GPIO45
  frequency: 400kHz

# Backlight
output:
  - platform: ledc
    pin: GPIO38
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: backlight
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_rgb
    model: ST7701S
    id: tft
    update_interval: never
    auto_clear_enabled: false
    spi_id: lcd_spi
    cs_pin: GPIO39
    dimensions:
      width: 480
      height: 480
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    pclk_frequency: 12MHz
    color_order: RGB
    invert_colors: false
    data_pins:
      red: [GPIO11, GPIO12, GPIO13, GPIO14, GPIO0]
      green: [GPIO8, GPIO20, GPIO3, GPIO46, GPIO9, GPIO10]
      blue: [GPIO4, GPIO5, GPIO6, GPIO7, GPIO15]

touchscreen:
  - platform: gt911
    id: touch
    address: 0x5D
    transform:
      mirror_x: false
      mirror_y: false

# Zustand der HA-Schalter auf dem Display anzeigen
binary_sensor:
  - platform: homeassistant
    id: ha_co2
    entity_id: switch.aqarium_co2_anlage
    on_state:
      then:
        - lvgl.widget.update:
            id: btn_co2
            state:
              checked: !lambda return x;
  - platform: homeassistant
    id: ha_licht
    entity_id: switch.aqarium_aqarium_licht_aquarium_licht
    on_state:
      then:
        - lvgl.widget.update:
            id: btn_licht
            state:
              checked: !lambda return x;

lvgl:
  displays:
    - tft
  touchscreens:
    - touch
  pages:
    - id: main_page
      widgets:
        - label:
            text: "Aquarium"
            align: TOP_MID
            y: 20
            text_font: montserrat_28
        - button:
            id: btn_licht
            x: 30
            y: 100
            width: 420
            height: 150
            checkable: true
            on_click:
              then:
                - homeassistant.action:
                    action: switch.toggle
                    data:
                      entity_id: switch.aqarium_aqarium_licht_aquarium_licht
            widgets:
              - label:
                  text: "Licht"
                  align: CENTER
                  text_font: montserrat_28
        - button:
            id: btn_co2
            x: 30
            y: 280
            width: 420
            height: 150
            checkable: true
            on_click:
              then:
                - homeassistant.action:
                    action: switch.toggle
                    data:
                      entity_id: switch.aqarium_co2_anlage
            widgets:
              - label:
                  text: "CO2"
                  align: CENTER
                  text_font: montserrat_28