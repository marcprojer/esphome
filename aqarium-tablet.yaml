              - label: {x: 50, y: 13, text: "Licht", text_font: inter_14}
              - label: {id: ov_light_state, x: 50, y: 33, text: "--", text_font: inter_14, text_color: 0x8C8C8C}
        - button:
            x: 169
            y: 230
            width: 141
            height: 64
            on_click:
              - script.execute: show_control
            widgets:
              - label: {id: ov_co2_icon, x: 14, y: 20, text: "\U000F07E4", text_font: mdi_24, text_color: 0x5C5C5C}
              - label: {x: 50, y: 13, text: "CO2", text_font: inter_14}
