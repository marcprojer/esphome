substitutions:
  # Home Assistant entities
  light_entity: switch.aqarium_aqarium_licht_aquarium_licht
  co2_entity: switch.aqarium_co2_anlage
  pump_entity: switch.aquarium_stecker_aquariumpumpe_pwm
  water_temp_entity: sensor.aquarium_monitor_water_temperature
  tds_entity: sensor.aquarium_monitor_tds
  tds_rise_entity: sensor.aquarium_monitor_tds_rise_since_water_change
  tds_jump_entity: binary_sensor.aquarium_monitor_tds_jump
  tds_high_entity: binary_sensor.aquarium_monitor_water_change_recommended
  room_temp_entity: sensor.aquarium_monitor_temperature
  room_humidity_entity: sensor.aquarium_monitor_humidity

esphome:
  name: aquarium-display
  friendly_name: Aquarium Display

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret aquarium_display__encryption_key
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: refresh_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: refresh_clock

# Colors: background 0x000000, tile 0x121212, text 0xFFFFFF / 0x8C8C8C / 0x5C5C5C,
# accent 0x4FD1C5 (on), warning 0xF5A524, alert 0xFF5C5C
font:
  - file: "gfonts://Inter@400"
    id: inter_14
    size: 14
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@500"
    id: inter_18
    size: 18
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@500"
    id: inter_22
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@300"
    id: inter_56
    size: 56
    bpp: 4
    glyphs: "0123456789.,+-%"
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: mdi_24
    size: 24
    bpp: 4
    glyphs:
      - "\U000F0335" # lightbulb
      - "\U000F07E4" # molecule-co2
      - "\U000F1402" # pump
      - "\U000F0026" # alert
      - "\U000F05E1" # check-circle-outline
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: mdi_28
    size: 28
    bpp: 4
    glyphs:
      - "\U000F0335" # lightbulb
      - "\U000F07E4" # molecule-co2
      - "\U000F1402" # pump

# Display-SPI (nur für die Init-Befehle des ST7701S)
spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  sda: GPIO19
  scl: GPIO45
  frequency: 400kHz

# Backlight
output:
  - platform: ledc
    pin: GPIO38
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: backlight
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_rgb
    model: ST7701S
    id: tft
    update_interval: never
    auto_clear_enabled: false
    spi_id: lcd_spi
    cs_pin: GPIO39
    dimensions:
      width: 480
      height: 480
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    pclk_frequency: 12MHz
    color_order: RGB
    invert_colors: false
    data_pins:
      red: [GPIO11, GPIO12, GPIO13, GPIO14, GPIO0]
      green: [GPIO8, GPIO20, GPIO3, GPIO46, GPIO9, GPIO10]
      blue: [GPIO4, GPIO5, GPIO6, GPIO7, GPIO15]

touchscreen:
  - platform: gt911
    id: touch
    address: 0x5D
    transform:
      mirror_x: false
      mirror_y: false

# ---------------------------------------------------------------------------
# Home Assistant states
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: homeassistant
    id: ha_light
    entity_id: ${light_entity}
    on_state:
      - if:
          condition:
            lambda: return x;
          then:
            - lvgl.label.update: {id: ov_light_icon, text_color: 0x4FD1C5}
            - lvgl.label.update: {id: ov_light_state, text: "An", text_color: 0xFFFFFF}
            - lvgl.label.update: {id: ctl_light_icon, text_color: 0x4FD1C5}
            - lvgl.label.update: {id: ctl_light_state, text: "Eingeschaltet"}
            - lvgl.widget.update: {id: ctl_light_switch, state: {checked: true}}
          else:
            - lvgl.label.update: {id: ov_light_icon, text_color: 0x5C5C5C}
            - lvgl.label.update: {id: ov_light_state, text: "Aus", text_color: 0x8C8C8C}
            - lvgl.label.update: {id: ctl_light_icon, text_color: 0x5C5C5C}
            - lvgl.label.update: {id: ctl_light_state, text: "Ausgeschaltet"}
            - lvgl.widget.update: {id: ctl_light_switch, state: {checked: false}}

  - platform: homeassistant
    id: ha_co2
    entity_id: ${co2_entity}
    on_state:
      - if:
          condition:
            lambda: return x;
          then:
            - lvgl.label.update: {id: ov_co2_icon, text_color: 0x4FD1C5}
            - lvgl.label.update: {id: ov_co2_state, text: "An", text_color: 0xFFFFFF}
            - lvgl.label.update: {id: ctl_co2_icon, text_color: 0x4FD1C5}
            - lvgl.label.update: {id: ctl_co2_state, text: "Eingeschaltet"}
            - lvgl.widget.update: {id: ctl_co2_switch, state: {checked: true}}
          else:
            - lvgl.label.update: {id: ov_co2_icon, text_color: 0x5C5C5C}
            - lvgl.label.update: {id: ov_co2_state, text: "Aus", text_color: 0x8C8C8C}
            - lvgl.label.update: {id: ctl_co2_icon, text_color: 0x5C5C5C}
            - lvgl.label.update: {id: ctl_co2_state, text: "Ausgeschaltet"}
            - lvgl.widget.update: {id: ctl_co2_switch, state: {checked: false}}

  - platform: homeassistant
    id: ha_pump
    entity_id: ${pump_entity}
    on_state:
      - if:
          condition:
            lambda: return x;
          then:
            - lvgl.label.update: {id: ov_pump_icon, text_color: 0x4FD1C5}
            - lvgl.label.update: {id: ov_pump_state, text: "An", text_color: 0xFFFFFF}
            - lvgl.label.update: {id: ctl_pump_icon, text_color: 0x4FD1C5}
            - lvgl.label.update: {id: ctl_pump_state, text: "Eingeschaltet"}
            - lvgl.widget.update: {id: ctl_pump_switch, state: {checked: true}}
          else:
            # pump off is unusual: highlight it
            - lvgl.label.update: {id: ov_pump_icon, text_color: 0xF5A524}
            - lvgl.label.update: {id: ov_pump_state, text: "Aus", text_color: 0xF5A524}
            - lvgl.label.update: {id: ctl_pump_icon, text_color: 0xF5A524}
            - lvgl.label.update: {id: ctl_pump_state, text: "Ausgeschaltet"}
            - lvgl.widget.update: {id: ctl_pump_switch, state: {checked: false}}

  - platform: homeassistant
    id: ha_tds_jump
    entity_id: ${tds_jump_entity}
    on_state:
      - script.execute: refresh_status

  - platform: homeassistant
    id: ha_tds_high
    entity_id: ${tds_high_entity}
    on_state:
      - script.execute: refresh_status

sensor:
  - platform: homeassistant
    id: ha_water_temp
    entity_id: ${water_temp_entity}
    on_value:
      - lvgl.label.update:
          id: ov_water_temp
          text: !lambda |-
            return isnan(x) ? std::string("--") : str_sprintf("%.1f", x);

  - platform: homeassistant
    id: ha_tds
    entity_id: ${tds_entity}
    on_value:
      - lvgl.label.update:
          id: ov_tds
          text: !lambda |-
            return isnan(x) ? std::string("--") : str_sprintf("%.0f", x);

  - platform: homeassistant
    id: ha_tds_rise
    entity_id: ${tds_rise_entity}
    on_value:
      - lvgl.label.update:
          id: ov_tds_rise
          text: !lambda |-
            if (isnan(x)) return std::string("Seit Wasserwechsel: --");
            return str_sprintf("Seit Wasserwechsel: %+.0f %%", x);

  - platform: homeassistant
    id: ha_room_temp
    entity_id: ${room_temp_entity}
    on_value:
      - script.execute: refresh_room

  - platform: homeassistant
    id: ha_room_humidity
    entity_id: ${room_humidity_entity}
    on_value:
      - script.execute: refresh_room

  # manual water tests (packages/aquarium_wasserwerte.yaml)
  - platform: homeassistant
    id: ha_ph
    entity_id: sensor.aquarium_ph
    on_value:
      - lvgl.label.update:
          id: ov_ph
          text: !lambda |-
            return isnan(x) ? std::string("--") : str_sprintf("%.1f", x);

  - platform: homeassistant
    id: ha_kh
    entity_id: sensor.aquarium_kh
    on_value:
      - lvgl.label.update:
          id: ov_kh
          text: !lambda |-
            return isnan(x) ? std::string("--") : str_sprintf("%.0f", x);

  - platform: homeassistant
    id: ha_co2_mgl
    entity_id: sensor.aquarium_co2
    on_value:
      - lvgl.label.update:
          id: ov_co2_mgl
          text: !lambda |-
            return isnan(x) ? std::string("--") : str_sprintf("%.0f", x);

  - platform: homeassistant
    id: ha_no3
    entity_id: sensor.aquarium_no3
    on_value:
      - lvgl.label.update:
          id: ov_no3
          text: !lambda |-
            return isnan(x) ? std::string("--") : str_sprintf("%.0f", x);

  - platform: homeassistant
    id: ha_out_of_range_count
    entity_id: sensor.aquarium_wasserwerte_status
    on_value:
      - script.execute: refresh_status

  # water change log (packages/aquarium_logbuch.yaml)
  - platform: homeassistant
    id: ha_water_change_due
    entity_id: sensor.aquarium_wasserwechsel_faellig
    on_value:
      - script.execute: refresh_water_change

text_sensor:
  - platform: homeassistant
    id: ha_out_of_range
    entity_id: sensor.aquarium_wasserwerte_status
    attribute: ausser_soll
    on_value:
      - script.execute: refresh_value_colors

# ---------------------------------------------------------------------------
# UI refresh
# ---------------------------------------------------------------------------
script:
  - id: refresh_clock
    then:
      - lvgl.label.update:
          id: hdr_clock
          text: !lambda |-
            auto now = id(ha_time).now();
            return now.is_valid() ? now.strftime("%H:%M") : std::string("");

  - id: refresh_room
    then:
      - lvgl.label.update:
          id: ov_room
          text: !lambda |-
            float t = id(ha_room_temp).state;
            float h = id(ha_room_humidity).state;
            if (isnan(t)) return std::string("Raum --");
            if (isnan(h)) return str_sprintf("Raum %.1f °C", t);
            return str_sprintf("Raum %.1f °C · %.0f %%", t, h);

  # most important message first: TDS jump > TDS high > tests out of range > ok
  - id: refresh_status
    then:
      - if:
          condition:
            binary_sensor.is_on: ha_tds_jump
          then:
            - lvgl.label.update: {id: ov_status_icon, text: "\U000F0026", text_color: 0xFF5C5C}
            - lvgl.label.update: {id: ov_status_text, text: "TDS-Sprung erkannt", text_color: 0xFF5C5C}
          else:
            - if:
                condition:
                  binary_sensor.is_on: ha_tds_high
                then:
                  - lvgl.label.update: {id: ov_status_icon, text: "\U000F0026", text_color: 0xF5A524}
                  - lvgl.label.update: {id: ov_status_text, text: "TDS zu hoch", text_color: 0xF5A524}
                else:
                  - if:
                      condition:
                        lambda: return id(ha_out_of_range_count).state >= 1;
                      then:
                        - lvgl.label.update: {id: ov_status_icon, text: "\U000F0026", text_color: 0xF5A524}
                        - lvgl.label.update:
                            id: ov_status_text
                            text_color: 0xF5A524
                            text: !lambda |-
                              int n = (int) id(ha_out_of_range_count).state;
                              return n == 1 ? std::string("1 Wert ausser Soll") : str_sprintf("%d Werte ausser Soll", n);
                      else:
                        - lvgl.label.update: {id: ov_status_icon, text: "\U000F05E1", text_color: 0x4FD1C5}
                        - lvgl.label.update: {id: ov_status_text, text: "Alles in Ordnung", text_color: 0xFFFFFF}
      - lvgl.label.update:
          id: ov_tds_rise
          text_color: !lambda |-
            return id(ha_tds_high).state ? lv_color_hex(0xF5A524) : lv_color_hex(0x8C8C8C);

  - id: refresh_value_colors
    then:
      - lvgl.label.update:
          id: ov_ph
          text_color: !lambda |-
            return id(ha_out_of_range).state.find("ph") != std::string::npos ? lv_color_hex(0xF5A524) : lv_color_hex(0xFFFFFF);
      - lvgl.label.update:
          id: ov_kh
          text_color: !lambda |-
            return id(ha_out_of_range).state.find("kh") != std::string::npos ? lv_color_hex(0xF5A524) : lv_color_hex(0xFFFFFF);
      - lvgl.label.update:
          id: ov_co2_mgl
          text_color: !lambda |-
            return id(ha_out_of_range).state.find("co2") != std::string::npos ? lv_color_hex(0xF5A524) : lv_color_hex(0xFFFFFF);
      - lvgl.label.update:
          id: ov_no3
          text_color: !lambda |-
            return id(ha_out_of_range).state.find("no3") != std::string::npos ? lv_color_hex(0xF5A524) : lv_color_hex(0xFFFFFF);

  - id: refresh_water_change
    then:
      - lvgl.label.update:
          id: ov_ww
          text: !lambda |-
            float d = id(ha_water_change_due).state;
            if (isnan(d)) return std::string("--");
            int n = (int) d;
            if (n > 1) return str_sprintf("in %d Tagen", n);
            if (n == 1) return std::string("morgen");
            if (n == 0) return std::string("heute");
            return n == -1 ? std::string("seit 1 Tag fällig") : str_sprintf("seit %d Tagen fällig", -n);
          text_color: !lambda |-
            float d = id(ha_water_change_due).state;
            return (!isnan(d) && d <= 0) ? lv_color_hex(0xF5A524) : lv_color_hex(0xFFFFFF);

  - id: show_overview
    then:
      - lvgl.page.show: page_overview
      - lvgl.label.update: {id: hdr_tab_overview, text_color: 0xFFFFFF}
      - lvgl.label.update: {id: hdr_tab_control, text_color: 0x5C5C5C}
      - lvgl.widget.update: {id: hdr_underline, x: 16}

  - id: show_control
    then:
      - lvgl.page.show: page_control
      - lvgl.label.update: {id: hdr_tab_overview, text_color: 0x5C5C5C}
      - lvgl.label.update: {id: hdr_tab_control, text_color: 0xFFFFFF}
      - lvgl.widget.update: {id: hdr_underline, x: 136}

# ---------------------------------------------------------------------------
# UI: dark, black/white, accent only for "on" and warnings
# ---------------------------------------------------------------------------
lvgl:
  displays:
    - tft
  touchscreens:
    - touch
  disp_bg_color: 0x000000
  default_font: inter_18
  theme:
    label:
      text_color: 0xFFFFFF
    obj:
      bg_color: 0x121212
      border_width: 0
      radius: 16
      pad_all: 0
      scrollbar_mode: "OFF"
    button:
      bg_color: 0x121212
      border_width: 0
      radius: 16
      shadow_width: 0
      pad_all: 0
      pressed:
        bg_color: 0x1E1E1E

  # header with page tabs and clock, shown on every page
  top_layer:
    widgets:
      - obj:
          x: 0
          y: 0
          width: 480
          height: 56
          radius: 0
          bg_color: 0x000000
          widgets:
            - button:
                x: 0
                y: 0
                width: 124
                height: 56
                bg_opa: TRANSP
                pressed:
                  bg_opa: TRANSP
                on_click:
                  - script.execute: show_overview
                widgets:
                  - label:
                      id: hdr_tab_overview
                      x: 16
                      y: 18
                      text: "Übersicht"
                      text_color: 0xFFFFFF
            - button:
                x: 124
                y: 0
                width: 124
                height: 56
                bg_opa: TRANSP
                pressed:
                  bg_opa: TRANSP
                on_click:
                  - script.execute: show_control
                widgets:
                  - label:
                      id: hdr_tab_control
                      x: 12
                      y: 18
                      text: "Steuerung"
                      text_color: 0x5C5C5C
            - obj:
                id: hdr_underline
                x: 16
                y: 46
                width: 24
                height: 3
                radius: 2
                bg_color: 0x4FD1C5
            - label:
                id: hdr_clock
                align: TOP_RIGHT
                x: -16
                y: 18
                text: ""
                text_color: 0x8C8C8C

  pages:
    # ---------------------------------------------------------------- Seite 1
    - id: page_overview
      bg_color: 0x000000
      scrollable: false
      widgets:
        # Wassertemperatur
        - obj:
            x: 16
            y: 68
            width: 216
            height: 150
            widgets:
              - label:
                  x: 18
                  y: 16
                  text: "WASSER"
                  text_font: inter_14
                  text_color: 0x8C8C8C
              - label:
                  id: ov_water_temp
                  x: 14
                  y: 40
                  text: "--"
                  text_font: inter_56
              - label:
                  x: 150
                  y: 52
                  text: "°C"
                  text_font: inter_18
                  text_color: 0x8C8C8C
              - label:
                  id: ov_room
                  x: 18
                  y: 118
                  text: "Raum --"
                  text_font: inter_14
                  text_color: 0x8C8C8C

        # TDS
        - obj:
            x: 248
            y: 68
            width: 216
            height: 150
            widgets:
              - label:
                  x: 18
                  y: 16
                  text: "TDS"
                  text_font: inter_14
                  text_color: 0x8C8C8C
              - label:
                  id: ov_tds
                  x: 14
                  y: 40
                  text: "--"
                  text_font: inter_56
              - label:
                  x: 150
                  y: 52
                  text: "ppm"
                  text_font: inter_18
                  text_color: 0x8C8C8C
              - label:
                  id: ov_tds_rise
                  x: 18
                  y: 118
                  text: "Seit Wasserwechsel: --"
