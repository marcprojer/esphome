                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: END
                    pad_column: 4
                  widgets:
                    - label: {id: ov_power, text: "--", text_font: inter_32}
                    - label: {text: "W", text_font: inter_18, text_color: 0x8C8C8C, pad_bottom: 4}

        # Nächster Wasserwechsel
        - obj:
            x: 169
            y: 306
            width: 141
            height: 80
            widgets:
              - label: {x: 14, y: 12, text: "Wasserwechsel", text_font: inter_14, text_color: 0x8C8C8C}
              - label: {id: ov_ww, x: 14, y: 40, width: 117, long_mode: DOT, text: "--"}

        # Nächste Zugabe (Dünger usw.)
        - obj:
            x: 322
            y: 306
            width: 142
            height: 80
            widgets:
              - label: {id: ov_dose_product, x: 14, y: 12, width: 118, long_mode: DOT, text: "Zugabe", text_font: inter_14, text_color: 0x8C8C8C}
              - label: {id: ov_dose, x: 14, y: 40, width: 118, long_mode: DOT, text: "--"}

        # Status
        - obj:
            x: 16
            y: 398
            width: 448
            height: 70
            widgets:
              - label: {id: ov_status_icon, x: 16, y: 23, text: "\U000F05E1", text_font: mdi_24, text_color: 0x5C5C5C}
              - label: {id: ov_status_text, x: 52, y: 25, width: 380, long_mode: DOT, text: "--"}

    # ---------------------------------------------------------------- Steuerung
    - id: page_control
      bg_color: 0x000000
      scrollable: false
      widgets:
        - button:
            x: 16
            y: 68
            width: 448
            height: 92
