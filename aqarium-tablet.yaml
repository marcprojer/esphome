            return isnan(v) ? std::string("--") : str_sprintf("%.0f", v);
          text_color: !lambda |-
            return (id(tank) ? id(ha1_out_of_range) : id(ha_out_of_range))->state.find("co2") != std::string::npos ? lv_color_hex(0xFF7A3D) : lv_color_hex(0xFFFFFF);
      # "zuletzt 12.10." or "neu"
      - lambda: |-
          auto sub = [](const std::string &pend, const std::string &date) -> std::string {
            if (!pend.empty()) return "neu";
            if (date.size() < 10) return "noch nie";
            return "zuletzt " + date.substr(8, 2) + "." + date.substr(5, 2) + ".";
          };
          id(wt_sub)[0] = sub(id(pending)[0], (id(tank) ? id(ha1_ph_date) : id(ha_ph_date))->state);
          id(wt_sub)[1] = sub(id(pending)[1], (id(tank) ? id(ha1_kh_date) : id(ha_kh_date))->state);
          id(wt_sub)[2] = sub(id(pending)[2], (id(tank) ? id(ha1_no2_date) : id(ha_no2_date))->state);
