                  widgets:
                    - label: {id: ctl_light_icon, align: CENTER, text: "\U000F0335", text_font: mdi_28, text_color: 0x5C5C5C}
              - label: {x: 90, y: 18, text: "Licht", text_font: inter_22}
              - label: {id: ctl_light_state, x: 90, y: 52, text: "--", text_font: inter_14, text_color: 0x8C8C8C}
              - switch:
                  id: ctl_light_switch
