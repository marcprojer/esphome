              - roller:
                  id: pk_roller
                  x: 16
                  y: 52
                  width: 448
                  height: 264
                  visible_row_count: 7
                  text_font: inter_18
                  text_align: CENTER
                  text_color: 0x5C5C5C
                  bg_color: 0x121212
                  border_width: 0
                  radius: 16
                  selected:
                    bg_color: 0x1E1E1E
                    text_color: 0xD9A920
