                  kh: !lambda return id(pending)[1];
                  no2: !lambda return id(pending)[2];
                  no3: !lambda return id(pending)[3];
                  nh4: !lambda return id(pending)[4];
          else:
            - homeassistant.action:
                action: script.aquarium_wasserwerte_vom_tablet
                data:
                  ph: !lambda return id(pending)[0];
                  kh: !lambda return id(pending)[1];
                  no2: !lambda return id(pending)[2];
                  no3: !lambda return id(pending)[3];
                  nh4: !lambda return id(pending)[4];
      - lambda: |-
          for (auto &p : id(pending)) p.clear();
      - lvgl.widget.update: {id: wt_save, bg_color: 0x121212}
      - lvgl.label.update: {id: wt_save_label, text: "Gespeichert", text_color: 0xD9A920}
      - delay: 3s
      - script.execute: refresh_water

  # Wasser tab, sub view "Wasserwechsel"
  - id: refresh_ww
    then:
      - lvgl.label.update:
          id: ww_val
          text: !lambda return str_sprintf("%.1f", id(ww_liter));
      - lvgl.label.update:
          id: ww_liters
          text: !lambda |-
            float vol = (id(tank) ? id(ha1_volume) : id(ha_volume))->state;
            if (isnan(vol) || vol <= 0) return std::string("");
            return str_sprintf("= %.0f %% von %.0f L", id(ww_liter) / vol * 100.0f, vol);
      - lvgl.widget.update:
          id: [ww_chip_1, ww_chip_2, ww_chip_3, ww_chip_4, ww_chip_5, ww_chip_6]
          bg_color: 0x121212
      - lvgl.label.update:
          id: [ww_chip_1_label, ww_chip_2_label, ww_chip_3_label, ww_chip_4_label, ww_chip_5_label, ww_chip_6_label]
          text_color: 0xFFFFFF
      - lambda: |-
          // highlight the preset matching the current amount
          struct Chip { float liter; lv_obj_t *btn; lv_obj_t *lbl; };
          const Chip chips[] = {
            {3.0f, id(ww_chip_1), id(ww_chip_1_label)}, {5.0f, id(ww_chip_2), id(ww_chip_2_label)},
            {7.5f, id(ww_chip_3), id(ww_chip_3_label)}, {10.0f, id(ww_chip_4), id(ww_chip_4_label)},
            {15.0f, id(ww_chip_5), id(ww_chip_5_label)}, {20.0f, id(ww_chip_6), id(ww_chip_6_label)},
          };
          for (auto &c : chips) {
            if (fabsf(c.liter - id(ww_liter)) > 0.01f) continue;
            lv_obj_set_style_bg_color(c.btn, lv_color_hex(0xD9A920), LV_PART_MAIN);
            lv_obj_set_style_text_color(c.lbl, lv_color_hex(0x000000), LV_PART_MAIN);
          }
      - lvgl.label.update:
          id: ww_last
          text: !lambda |-
            auto &t = (id(tank) ? id(ha1_last_ww_time) : id(ha_last_ww_time))->state;
            float liter = (id(tank) ? id(ha1_last_ww) : id(ha_last_ww))->state;
            float pct = (id(tank) ? id(ha1_last_ww_pct) : id(ha_last_ww_pct))->state;
            if (t.size() < 10 || isnan(liter)) return std::string("Letzter: noch keiner erfasst");
            return "Letzter: " + t.substr(8, 2) + "." + t.substr(5, 2) + "." + t.substr(0, 4) +
                   str_sprintf(" mit %.1f L", liter) + (isnan(pct) ? std::string("") : str_sprintf(" (%.0f %%)", pct));
      - lvgl.label.update:
          id: ww_next
          text: !lambda |-
            float d = (id(tank) ? id(ha1_water_change_due) : id(ha_water_change_due))->state;
            if (isnan(d)) return std::string("Nächster: --");
            int n = (int) d;
            if (n > 1) return str_sprintf("Nächster: in %d Tagen", n);
            if (n == 1) return std::string("Nächster: morgen");
            if (n == 0) return std::string("Nächster: heute");
            return str_sprintf("Nächster: seit %d %s fällig", -n, n == -1 ? "Tag" : "Tagen");
          text_color: !lambda |-
            float d = (id(tank) ? id(ha1_water_change_due) : id(ha_water_change_due))->state;
            return (!isnan(d) && d <= 0) ? lv_color_hex(0xFF7A3D) : lv_color_hex(0x8C8C8C);
      - lvgl.label.update:
          id: ww_save_label
          text: !lambda return str_sprintf("%.1f L Wasserwechsel speichern", id(ww_liter));

  - id: save_water_change
    mode: single
    then:
      - if:
          condition:
            lambda: return id(tank) == 1;
          then:
            - homeassistant.action:
                action: script.aquarium1_wasserwechsel_vom_tablet
                data:
                  liter: !lambda return str_sprintf("%.1f", id(ww_liter));
          else:
            - homeassistant.action:
                action: script.aquarium_wasserwechsel_vom_tablet
                data:
                  liter: !lambda return str_sprintf("%.1f", id(ww_liter));
      - lambda: id(ww_touched) = false;
      - lvgl.label.update: {id: ww_save_label, text: "Gespeichert"}
      - delay: 3s
      - script.execute: refresh_ww

  # Hardware (Licht, CO2, Pumpe, Monitor, Leistung) gibt es vorerst nur für Becken 0.
  # Bei Becken 1 zeigen die Kacheln "--" und die Steuerung ist gesperrt.
  - id: refresh_hw
    then:
      - lvgl.label.update:
          id: ov_water_temp
          text: !lambda |-
            float x = id(ha_water_temp).state;
            return (id(tank) != 0 || isnan(x)) ? std::string("--") : str_sprintf("%.1f", x);
      - lvgl.label.update:
          id: ov_tds
          text: !lambda |-
            float x = id(ha_tds).state;
            return (id(tank) != 0 || isnan(x)) ? std::string("--") : str_sprintf("%.0f", x);
      - lvgl.label.update:
          id: ov_tds_rise
          text: !lambda |-
            if (id(tank) != 0) return std::string("Sensoren folgen");
            float x = id(ha_tds_rise).state;
            if (isnan(x)) return std::string("Seit Wasserwechsel: --");
            return str_sprintf("Seit Wasserwechsel: %+.0f %%", x);
      - lvgl.label.update:
          id: ov_power
          text: !lambda |-
            float x = id(ha_power).state;
            if (id(tank) != 0 || isnan(x)) return std::string("--");
            return x < 10 ? str_sprintf("%.1f", x) : str_sprintf("%.0f", x);
      - script.execute: refresh_room
      # Geräte: Akzent = an, grau = aus, orange = Pumpe aus (ungewöhnlich)
      - lambda: |-
          struct Dev { binary_sensor::BinarySensor *ha; lv_obj_t *ov_icon, *ov_state, *ctl_icon, *ctl_state; bool warn_off; };
          const Dev devs[] = {
            {id(ha_light), id(ov_light_icon), id(ov_light_state), id(ctl_light_icon), id(ctl_light_state), false},
            {id(ha_co2), id(ov_co2_icon), id(ov_co2_state), id(ctl_co2_icon), id(ctl_co2_state), false},
            {id(ha_pump), id(ov_pump_icon), id(ov_pump_state), id(ctl_pump_icon), id(ctl_pump_state), true},
          };
          for (auto &d : devs) {
            uint32_t icon, text;
            const char *ov, *ctl;
            if (id(tank) != 0) {
              icon = 0x5C5C5C; text = 0x8C8C8C; ov = "--"; ctl = "Noch nicht eingebunden";
            } else if (d.ha->state) {
              icon = 0xD9A920; text = 0xFFFFFF; ov = "An"; ctl = "Eingeschaltet";
            } else {
              icon = d.warn_off ? 0xFF7A3D : 0x5C5C5C; text = d.warn_off ? 0xFF7A3D : 0x8C8C8C;
              ov = "Aus"; ctl = "Ausgeschaltet";
            }
            lv_obj_set_style_text_color(d.ov_icon, lv_color_hex(icon), LV_PART_MAIN);
            lv_obj_set_style_text_color(d.ctl_icon, lv_color_hex(icon), LV_PART_MAIN);
            lv_obj_set_style_text_color(d.ov_state, lv_color_hex(text), LV_PART_MAIN);
            lv_label_set_text(d.ov_state, ov);
            lv_label_set_text(d.ctl_state, ctl);
          }
          lv_obj_t *sw[] = {id(ctl_light_switch), id(ctl_co2_switch), id(ctl_pump_switch)};
          for (int i = 0; i < 3; i++) {
            if (id(tank) == 0 && devs[i].ha->state) lv_obj_add_state(sw[i], LV_STATE_CHECKED);
            else lv_obj_clear_state(sw[i], LV_STATE_CHECKED);
          }

  # Steuerung: Knöpfe "Wartung" des aktiven Beckens (Text und Dauern aus HA, orange = läuft)
  - id: refresh_maint
    then:
      - lambda: |-
          bool t1 = id(tank) == 1;
          bool on = (t1 ? id(ha1_wartung) : id(ha_wartung))->state;
          auto &t = (t1 ? id(ha1_wartung_text) : id(ha_wartung_text))->state;
          float dauer = (t1 ? id(ha1_wartung_dauer) : id(ha_wartung_dauer))->state;
          bool ok = !t.empty() && t != "unknown" && t != "unavailable";
          lv_label_set_text(id(ctl_maint_state), ok ? t.c_str() : "--");
          lv_obj_set_style_text_color(id(ctl_maint_state), lv_color_hex(on ? 0xFF7A3D : 0x8C8C8C), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(ctl_maint_icon), lv_color_hex(on ? 0xFF7A3D : 0x5C5C5C), LV_PART_MAIN);
          lv_obj_t *bt[2] = {id(ctl_maint_b0), id(ctl_maint_b1)};
          lv_obj_t *lb[2] = {id(ctl_maint_b0_label), id(ctl_maint_b1_label)};
          for (int i = 0; i < 2; i++) {
            int m = aqcare::knopf((t1 ? id(ha1_wartung_knoepfe) : id(ha_wartung_knoepfe))->state, i);
            if (m <= 0) { lv_obj_add_flag(bt[i], LV_OBJ_FLAG_HIDDEN); continue; }
            lv_obj_clear_flag(bt[i], LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(lb[i], (std::to_string(m) + " min").c_str());
            bool act = on && !isnan(dauer) && (int) dauer == m;
            lv_obj_set_style_bg_color(bt[i], lv_color_hex(act ? 0xFF7A3D : 0x2A2A2A), LV_PART_MAIN);
            lv_obj_set_style_text_color(lb[i], lv_color_hex(act ? 0x000000 : 0xFFFFFF), LV_PART_MAIN);
          }

  # Wartungsknopf i (0/1): HA-Skript mit der Dauer des Knopfs; derselbe Knopf nochmals beendet
  - id: maint_press
    parameters:
      i: int
    then:
      - lambda: |-
          id(maint_min) = aqcare::knopf((id(tank) ? id(ha1_wartung_knoepfe) : id(ha_wartung_knoepfe))->state, i);
      - if:
          condition:
            lambda: return id(maint_min) > 0 && id(tank) == 0;
          then:
            - homeassistant.action:
                action: script.aquarium_wartung_umschalten
                data:
                  minuten: !lambda return std::to_string(id(maint_min));
      - if:
          condition:
            lambda: return id(maint_min) > 0 && id(tank) == 1;
          then:
            - homeassistant.action:
                action: script.aquarium1_wartung_umschalten
                data:
                  minuten: !lambda return std::to_string(id(maint_min));

  # Kopfzeile: Kurzname des aktiven Beckens (letztes Wort, z. B. "Garnelen")
  - id: refresh_header
    then:
      - lvgl.label.update:
          id: hdr_tank
          text: !lambda |-
            auto &nm = (id(tank) ? id(ha1_name) : id(ha_name))->state;
            if (nm.empty() || nm == "unknown") return std::string(id(tank) ? "2" : "1");
            size_t p = nm.find_last_of(' ');
            return p == std::string::npos ? nm : nm.substr(p + 1);

  # Startseite: Name, Wasserwechsel, nächste Zugabe, nächste Fütterung und Status je Becken.
  # Punkte davor: grün = ok, gelb = heute, orange = fällig bzw. Warnung, rot = TDS-Sprung
  - id: refresh_start
    then:
      - lambda: |-
          auto days = [](int n, bool known) -> std::string {
            if (!known) return "--";
            if (n > 1) return str_sprintf("in %d Tagen", n);
            if (n == 1) return "morgen";
            if (n == 0) return "heute";
            return n == -1 ? std::string("seit 1 Tag fällig") : str_sprintf("seit %d Tagen fällig", -n);
          };
          auto dot = [](int n, bool known) -> uint32_t { return !known ? 0x5C5C5C : n < 0 ? 0xFF7A3D : n == 0 ? 0xD9A920 : 0x4CAF50; };
          struct T {
            text_sensor::TextSensor *name, *product, *wtext, *more, *food, *food_lvl; sensor::Sensor *due, *oor, *warn;
            lv_obj_t *l_name, *l_ww, *l_dose, *l_food, *l_status, *d_ww, *d_dose, *d_food, *d_status; const char *fallback;
          };
          const T tanks[] = {
            {id(ha_name), id(ha_next_dose_product), id(ha_warn_text), id(ha_next_dose_more), id(ha_food_text), id(ha_food_level),
             id(ha_water_change_due), id(ha_out_of_range_count), id(ha_warn_count),
             id(st0_name), id(st0_ww), id(st0_dose), id(st0_food), id(st0_status),
             id(st0_ww_dot), id(st0_dose_dot), id(st0_food_dot), id(st0_status_dot), "Becken 1"},
            {id(ha1_name), id(ha1_next_dose_product), id(ha1_warn_text), id(ha1_next_dose_more), id(ha1_food_text), id(ha1_food_level),
             id(ha1_water_change_due), id(ha1_out_of_range_count), id(ha1_warn_count),
             id(st1_name), id(st1_ww), id(st1_dose), id(st1_food), id(st1_status),
             id(st1_ww_dot), id(st1_dose_dot), id(st1_food_dot), id(st1_status_dot), "Becken 2"},
          };
          for (int t = 0; t < 2; t++) {
            auto &k = tanks[t];
            std::string nm = k.name->state;
            lv_label_set_text(k.l_name, (nm.empty() || nm == "unknown") ? k.fallback : nm.c_str());

            float due = k.due->state;
            std::string ww = "Wasserwechsel " + days((int) due, !isnan(due));
            lv_label_set_text(k.l_ww, ww.c_str());
            lv_obj_set_style_bg_color(k.d_ww, lv_color_hex(dot((int) due, !isnan(due))), LV_PART_MAIN);

            int dd = id(dose_days)[t];
            std::string pr = k.product->state;
            if (pr.empty() || pr == "unknown") pr = "Zugabe";
            std::string dose = pr + " " + days(dd, dd != INT_MIN);
            int more = atoi(k.more->state.c_str());
            if (dd != INT_MIN && more > 0) dose += str_sprintf(" (+%d)", more);
            lv_label_set_text(k.l_dose, dose.c_str());
            lv_obj_set_style_bg_color(k.d_dose, lv_color_hex(dot(dd, dd != INT_MIN)), LV_PART_MAIN);

            // Fütterung: Text und Stufe rechnet HA (sensor.aquarium<s>_naechste_fuetterung)
            std::string fd = k.food->state;
            bool fk = !fd.empty() && fd != "unknown" && fd != "unavailable";
            int fl = atoi(k.food_lvl->state.c_str());
            lv_label_set_text(k.l_food, fk ? fd.c_str() : "Fütterung --");
            lv_obj_set_style_bg_color(k.d_food, lv_color_hex(!fk ? 0x5C5C5C : fl >= 2 ? 0xFF7A3D : fl == 1 ? 0xD9A920 : 0x4CAF50), LV_PART_MAIN);

            // Status: TDS (nur Becken 0) > Warnungen aus HA > Werte ausser Soll > ok
            std::string st; uint32_t col;
            int oor = isnan(k.oor->state) ? 0 : (int) k.oor->state;
            int nw = isnan(k.warn->state) ? 0 : (int) k.warn->state;
            std::string wt = k.wtext->state;
            if (t == 0 && id(ha_tds_jump).state) { st = "TDS-Sprung erkannt"; col = 0xFF5C5C; }
            else if (t == 0 && id(ha_tds_high).state) { st = "TDS zu hoch"; col = 0xFF7A3D; }
            else if (nw >= 1) {
              st = (wt.empty() || wt == "unknown") ? str_sprintf("%d Warnungen", nw) : (nw > 1 ? wt + str_sprintf(" (+%d)", nw - 1) : wt);
              col = 0xFF7A3D;
            }
            else if (oor >= 1) { st = oor == 1 ? std::string("1 Wert ausser Soll") : str_sprintf("%d Werte ausser Soll", oor); col = 0xFF7A3D; }
            else { st = "Alles in Ordnung"; col = 0x4CAF50; }
            lv_label_set_text(k.l_status, st.c_str());
            lv_obj_set_style_bg_color(k.d_status, lv_color_hex(col), LV_PART_MAIN);
          }

  # Startseite: Wassertemperatur und TDS unter dem Namen (nur Becken 0 hat den Monitor).
  # Links Temperatur mit Änderung seit 24 h, rechts TDS mit Anstieg seit dem Wasserwechsel
  # (ab 25 % orange, wie die HA-Karte). Wert weiss, Veränderung grau darunter.
  - id: refresh_start_values
    then:
      - lambda: |-
          float t = id(ha_water_temp).state, t24 = id(ha_water_temp_24h).state;
          float d = id(ha_tds).state, r = id(ha_tds_rise).state;
          if (!isnan(t24) && fabsf(t24) < 0.05f) t24 = 0;
          lv_label_set_text(id(st0_temp), isnan(t) ? "" : str_sprintf("%.1f °C", t).c_str());
          lv_label_set_text(id(st0_temp_d), (isnan(t) || isnan(t24)) ? "" : str_sprintf("%+.1f°", t24).c_str());
          lv_label_set_text(id(st0_tds), isnan(d) ? "" : str_sprintf("%.0f ppm", d).c_str());
          lv_label_set_text(id(st0_tds_d), (isnan(d) || isnan(r)) ? "" : str_sprintf("%+.0f %%", r).c_str());
          lv_obj_set_style_text_color(id(st0_tds_d), lv_color_hex(!isnan(r) && r >= 25 ? 0xFF7A3D : 0x8C8C8C), LV_PART_MAIN);

  # Startseite: Berührung eines Beckens. phase 0 = Druck, 1 = Loslassen, 2 = langer Druck.
  # Lampe bzw. Diffusor leuchten beim Drücken auf; ein langer Druck darauf schaltet
  # Licht bzw. CO2 um (Becken 1: nur Licht). Kurzes Tippen öffnet das Becken (on_short_click).
  - id: tank_touch
    parameters:
      n: int
      phase: int
    then:
      - lambda: |-
          id(press_entity) = "";
          auto &t = aq_tank[n];
          if (!t.ready()) return;
          if (phase == 1) { t.release(); return; }
          lv_indev_t *in = lv_indev_active();
          if (in == nullptr) return;
          lv_point_t p;
          lv_indev_get_point(in, &p);
          lv_area_t a;
          lv_obj_get_coords((lv_obj_t *) (n ? id(st1_canvas) : id(st0_canvas)), &a);
          int k = t.hit(p.x - a.x1, p.y - a.y1);
          if (phase == 0) { if (k != aqpx::HL_NONE) t.press(k, millis()); return; }
          const char *e = "";
          if (k == aqpx::HL_LAMP) e = n ? "${tank1_light_entity}" : "${light_entity}";
          else if (k == aqpx::HL_CO2 && n == 0) e = "${co2_entity}";
          if (*e == 0) { t.release(); return; }
          t.flash(k, millis());
          id(press_entity) = e;
      - if:
          condition:
            lambda: return !id(press_entity).empty();
          then:
            - homeassistant.action:
                action: homeassistant.toggle
                data:
                  entity_id: !lambda return id(press_entity);

  - id: show_start
    then:
      - lambda: id(start_visible) = true;
      - lvgl.widget.hide: ed_overlay
      - lvgl.widget.hide: pk_overlay
      - lvgl.widget.hide: fp_overlay
      - lvgl.widget.hide: fd_overlay
      - lvgl.widget.hide: hdr_nav
      - lvgl.widget.show: hdr_title
      - lvgl.page.show: page_start
      - script.execute: refresh_dose

  # Becken öffnen: aktives Becken setzen, offene Eingaben verwerfen, alles neu zeichnen
  - id: open_tank
    parameters:
      n: int
    then:
      - lambda: |-
          id(tank) = n;
          id(start_visible) = false;
          for (auto &p : id(pending)) p.clear();
          id(ww_touched) = false;
          float d = (n ? id(ha1_ww_default) : id(ha_ww_default))->state;
          id(ww_liter) = (!isnan(d) && d > 0) ? d : 5.0f;
          for (int k = 0; k < 2; k++) { id(care_pick)[k].clear(); id(care_val)[k] = 1.0f; }
      - script.execute: refresh_header
      - script.execute: refresh_hw
      - script.execute: refresh_status
      - script.execute: refresh_water_change
      - script.execute: refresh_dose
      - script.execute: refresh_water
      - script.execute: refresh_ww
      - script.execute: refresh_care
      - script.execute: refresh_maint
      - script.execute: {id: show_care, v: 0}
      - lvgl.widget.hide: hdr_title
      - lvgl.widget.show: hdr_nav
      - script.execute: show_overview

  # Tab "Pflege": Unter-Tab zeigen (0 Werte, 1 Wasserwechsel, 2 Zugabe, 3 Futter)
  - id: show_care
    parameters:
      v: int
    then:
      - lambda: |-
          lv_obj_t *views[4] = {id(wt_values_view), id(ww_view), id(zg_view), id(fu_view)};
          lv_obj_t *segs[4] = {id(wt_seg_values), id(wt_seg_change), id(wt_seg_dose), id(wt_seg_food)};
          lv_obj_t *lbls[4] = {id(wt_seg_values_label), id(wt_seg_change_label), id(wt_seg_dose_label), id(wt_seg_food_label)};
          for (int i = 0; i < 4; i++) {
            if (i == v) lv_obj_clear_flag(views[i], LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(views[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(segs[i], lv_color_hex(i == v ? 0x2A2A2A : 0x121212), LV_PART_MAIN);
            lv_obj_set_style_text_color(lbls[i], lv_color_hex(i == v ? 0xFFFFFF : 0x8C8C8C), LV_PART_MAIN);
          }
      - if:
          condition:
            lambda: return v == 1;
          then:
            - script.execute: refresh_ww
      - if:
          condition:
            lambda: return v >= 2;
          then:
            - script.execute: refresh_care

  # Tab "Pflege", Zugabe und Futter: Eintrag (gewählt oder Vorschlag aus HA), Info,
  # Menge mit Einheit, Schnellwahl und Speichern-Knopf für das aktive Becken
  - id: refresh_care
    then:
      - lambda: |-
          bool t1 = id(tank) == 1;
          struct V {
            text_sensor::TextSensor *list, *vor;
            lv_obj_t *name, *info, *val, *unit, *save;
            lv_obj_t *chip[5], *chipl[5];
            const char *save_txt;
          };
          const V vs[2] = {
            {t1 ? id(ha1_care_zug) : id(ha_care_zug), t1 ? id(ha1_care_zug_vor) : id(ha_care_zug_vor),
             id(zg_name), id(zg_info), id(zg_val), id(zg_unit), id(zg_save_label),
             {id(zg_chip_1), id(zg_chip_2), id(zg_chip_3), id(zg_chip_4), id(zg_chip_5)},
             {id(zg_chip_1_label), id(zg_chip_2_label), id(zg_chip_3_label), id(zg_chip_4_label), id(zg_chip_5_label)},
             "Zugabe speichern"},
            {t1 ? id(ha1_care_fut) : id(ha_care_fut), t1 ? id(ha1_care_fut_vor) : id(ha_care_fut_vor),
             id(fu_name), id(fu_info), id(fu_val), id(fu_unit), id(fu_save_label),
             {id(fu_chip_1), id(fu_chip_2), id(fu_chip_3), id(fu_chip_4), id(fu_chip_5)},
             {id(fu_chip_1_label), id(fu_chip_2_label), id(fu_chip_3_label), id(fu_chip_4_label), id(fu_chip_5_label)},
             "Fütterung speichern"},
          };
          for (int k = 0; k < 2; k++) {
            auto &v = vs[k];
            auto items = aqcare::parse(v.list->state);
            int i = aqcare::find(items, id(care_pick)[k]);
            if (i < 0) i = aqcare::find(items, v.vor->state);
            if (i < 0 && !items.empty()) i = 0;
            float val = id(care_val)[k];
            if (i < 0) {
              id(care_cur)[k].clear();
              lv_label_set_text(v.name, "--");
              lv_label_set_text(v.info, k ? "Kein Futter in einstellungen.yaml" : "Keine Zusätze in einstellungen.yaml");
              lv_label_set_text(v.unit, "");
            } else {
              auto &it = items[i];
              id(care_cur)[k] = it.name;
              id(care_step)[k] = it.step;
              bool vorschlag = it.name == v.vor->state;
              lv_label_set_text(v.name, it.name.c_str());
              lv_label_set_text(v.info, it.info.c_str());
              lv_obj_set_style_text_color(v.info, lv_color_hex(vorschlag ? 0xD9A920 : 0x8C8C8C), LV_PART_MAIN);
              lv_label_set_text(v.unit, (val > 1 ? it.unitn : it.unit1).c_str());
            }
            lv_label_set_text(v.val, aqcare::fmt(val).c_str());
            const float *c = aqcare::chips(i < 0 ? std::string("") : items[i].unit1);
            for (int j = 0; j < 5; j++) {
              bool on = fabsf(c[j] - val) < 0.01f;
              lv_label_set_text(v.chipl[j], aqcare::fmt(c[j]).c_str());
              lv_obj_set_style_bg_color(v.chip[j], lv_color_hex(on ? 0xD9A920 : 0x121212), LV_PART_MAIN);
              lv_obj_set_style_text_color(v.chipl[j], lv_color_hex(on ? 0x000000 : 0xFFFFFF), LV_PART_MAIN);
            }
            bool saved = id(care_saved)[k] && millis() - id(care_saved)[k] < 3000;
            lv_label_set_text(v.save, saved ? "Gespeichert" : v.save_txt);
          }

  # Menge ändern: d = +1/-1 Schritt (0.25 bzw. 0.5), sonst direkt auf "wert" (Schnellwahl)
  - id: care_amount
    parameters:
      k: int
      d: int
      wert: float
    then:
      - lambda: |-
          float st = id(care_step)[k];
          float x = d ? id(care_val)[k] + d * st : wert;
          id(care_val)[k] = std::min(50.0f, std::max(st, x));
      - script.execute: refresh_care

  # Auswahl öffnen (Roller mit allen Zusätzen bzw. Futtersorten)
  - id: open_picker
    parameters:
      k: int
    then:
      - lambda: |-
          id(care_kind) = k;
          bool t1 = id(tank) == 1;
          auto &raw = (k ? (t1 ? id(ha1_care_fut) : id(ha_care_fut)) : (t1 ? id(ha1_care_zug) : id(ha_care_zug)))->state;
          auto items = aqcare::parse(raw);
          std::string opts = aqcare::options(items);
          lv_roller_set_options(id(pk_roller)->obj, opts.c_str(), LV_ROLLER_MODE_NORMAL);
          int i = aqcare::find(items, id(care_cur)[k]);
          lv_roller_set_selected(id(pk_roller)->obj, i < 0 ? 0 : i, LV_ANIM_OFF);
          lv_label_set_text(id(pk_title), k ? "Futter wählen" : "Zusatz wählen");
      - lvgl.widget.show: pk_overlay

  - id: pick_apply
    then:
      - lambda: |-
          int k = id(care_kind);
          bool t1 = id(tank) == 1;
          auto &raw = (k ? (t1 ? id(ha1_care_fut) : id(ha_care_fut)) : (t1 ? id(ha1_care_zug) : id(ha_care_zug)))->state;
          auto items = aqcare::parse(raw);
          uint32_t i = lv_roller_get_selected(id(pk_roller)->obj);
          if (i < items.size() && items[i].name != id(care_cur)[k]) {
            id(care_pick)[k] = items[i].name;
            id(care_val)[k] = 1.0f;
          }
      - lvgl.widget.hide: pk_overlay
      - script.execute: refresh_care

  # Speichern über script.aquarium<s>_zugabe_vom_tablet bzw. _futter_vom_tablet.
  # Danach folgt die Auswahl wieder dem Vorschlag aus HA (nächster fälliger Eintrag).
  - id: save_care
    mode: single
    parameters:
      k: int
    then:
      - if:
          condition:
            lambda: return !id(care_cur)[k].empty() && id(care_val)[k] > 0;
          then:
            - if:
                condition:
                  lambda: return k == 0 && id(tank) == 1;
                then:
                  - homeassistant.action:
                      action: script.aquarium1_zugabe_vom_tablet
                      data:
                        produkt: !lambda return id(care_cur)[0];
                        menge: !lambda return aqcare::fmt(id(care_val)[0]);
            - if:
                condition:
                  lambda: return k == 0 && id(tank) == 0;
                then:
                  - homeassistant.action:
                      action: script.aquarium_zugabe_vom_tablet
                      data:
                        produkt: !lambda return id(care_cur)[0];
                        menge: !lambda return aqcare::fmt(id(care_val)[0]);
            - if:
                condition:
                  lambda: return k == 1 && id(tank) == 1;
                then:
                  - homeassistant.action:
                      action: script.aquarium1_futter_vom_tablet
                      data:
                        sorte: !lambda return id(care_cur)[1];
                        menge: !lambda return aqcare::fmt(id(care_val)[1]);
            - if:
                condition:
                  lambda: return k == 1 && id(tank) == 0;
                then:
                  - homeassistant.action:
                      action: script.aquarium_futter_vom_tablet
                      data:
                        sorte: !lambda return id(care_cur)[1];
                        menge: !lambda return aqcare::fmt(id(care_val)[1]);
            - lambda: |-
                // Futter: nach der Fütterungspause fragen, wenn die Futterart es will und HA sie
                // anbietet (Attribut fuetterungspause > 0: CO2 oder Pumpe an, keine Pause läuft)
                id(fp_min) = 0;
                if (k == 1) {
                  bool t1 = id(tank) == 1;
                  auto items = aqcare::parse((t1 ? id(ha1_care_fut) : id(ha_care_fut))->state);
                  int i = aqcare::find(items, id(care_cur)[1]);
                  float fp = (t1 ? id(ha1_fpause) : id(ha_fpause))->state;
                  if (i >= 0 && items[i].pause && !isnan(fp) && fp >= 1) id(fp_min) = (int) fp;
                }
                id(care_pick)[k].clear();
                id(care_val)[k] = 1.0f;
                id(care_saved)[k] = millis();
            - script.execute: refresh_care
            - if:
                condition:
                  lambda: return id(fp_min) > 0;
                then:
                  - script.execute: fp_ask
            - delay: 3s
            - script.execute: refresh_care

  # Rückfrage nach dem Füttern: CO2-Anlage und Pumpe für fp_min Minuten aus? Ohne Antwort
  # schliesst sie nach 20 s (= nein)
  - id: fp_ask
    mode: restart
    then:
      - lambda: |-
          std::string m = std::to_string(id(fp_min));
          lv_label_set_text(id(fp_text), ("CO2-Anlage und Pumpe für " + m + " min ausschalten?").c_str());
          lv_label_set_text(id(fp_yes_label), ("Ja, " + m + " min").c_str());
      - lvgl.widget.show: fp_overlay
      - delay: 20s
      - lvgl.widget.hide: fp_overlay

  - id: fp_answer
    parameters:
      ja: bool
    then:
      - script.stop: fp_ask
      - lvgl.widget.hide: fp_overlay
      - if:
          condition:
            lambda: return ja && id(fp_min) > 0 && id(tank) == 0;
          then:
            - homeassistant.action:
                action: script.aquarium_wartung_starten
                data:
                  minuten: !lambda return std::to_string(id(fp_min));
                  grund: Fütterung
      - if:
          condition:
            lambda: return ja && id(fp_min) > 0 && id(tank) == 1;
          then:
            - homeassistant.action:
                action: script.aquarium1_wartung_starten
                data:
                  minuten: !lambda return std::to_string(id(fp_min));
                  grund: Fütterung

  # Liste "Fälligkeiten" des aktiven Beckens (langer Druck auf den Tab "Pflege"). Die Zeilen
  # kommen fertig sortiert aus HA (Attribut "faelligkeiten" von sensor.aquarium<s>_tablet_pflege);
  # ein Tipp springt in den passenden Unter-Tab und wählt den Eintrag aus
  - id: fd_open
    then:
      - lvgl.widget.show: fd_overlay
      - script.execute: fd_fill

  # Liste neu aufbauen (nur wenn sichtbar; auch wenn HA neue Fälligkeiten schickt)
  - id: fd_fill
    then:
      - lambda: |-
          if (lv_obj_has_flag(id(fd_overlay), LV_OBJ_FLAG_HIDDEN)) return;
          bool t1 = id(tank) == 1;
          lv_obj_t *list = id(fd_list);
          lv_obj_clean(list);
          lv_obj_set_flex_flow(list, LV_FLEX_FLOW_COLUMN);
          lv_obj_set_style_pad_row(list, 6, LV_PART_MAIN);
          auto rows = aqcare::parse_due((t1 ? id(ha1_care_due) : id(ha_care_due))->state);
          id(fd_tab).clear();
          id(fd_entry).clear();
          for (auto &r : rows) { id(fd_tab).push_back(r.tab); id(fd_entry).push_back(r.eintrag); }
          const lv_font_t *f18 = lv_obj_get_style_text_font(id(hdr_tab_water), LV_PART_MAIN);
          const lv_font_t *f14 = lv_obj_get_style_text_font(id(st0_ww), LV_PART_MAIN);
          // Punkt und Text "wann" je Stufe: später, heute/morgen, überfällig, noch nie
          static const uint32_t dot[4] = {0x5C5C5C, 0xFF7A3D, 0xFF5C5C, 0x2A2A2A};
          static const uint32_t txt[4] = {0x8C8C8C, 0xFF7A3D, 0xFF5C5C, 0x5C5C5C};
          static const char *art[4] = {"", "", "Zugabe", "Fütterung"};
          if (rows.empty()) {
            lv_obj_t *l = lv_label_create(list);
            lv_obj_set_style_text_font(l, f18, LV_PART_MAIN);
            lv_obj_set_style_text_color(l, lv_color_hex(0x8C8C8C), LV_PART_MAIN);
            lv_label_set_text(l, "Nichts mit Intervall eingerichtet");
            return;
          }
          for (size_t i = 0; i < rows.size(); i++) {
            auto &r = rows[i];
            int st = r.stufe < 0 || r.stufe > 3 ? 0 : r.stufe;
            lv_obj_t *row = lv_obj_create(list);
            lv_obj_remove_style_all(row);
            lv_obj_set_size(row, 448, 56);
            lv_obj_set_style_radius(row, 12, LV_PART_MAIN);
            lv_obj_set_style_bg_opa(row, LV_OPA_COVER, LV_PART_MAIN);
            lv_obj_set_style_bg_color(row, lv_color_hex(0x121212), LV_PART_MAIN);
            lv_obj_set_style_bg_color(row, lv_color_hex(0x1E1E1E), LV_PART_MAIN | LV_STATE_PRESSED);
            lv_obj_add_flag(row, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_clear_flag(row, LV_OBJ_FLAG_SCROLLABLE);
            lv_obj_t *d = lv_obj_create(row);
            lv_obj_remove_style_all(d);
            lv_obj_set_size(d, 10, 10);
            lv_obj_set_style_radius(d, LV_RADIUS_CIRCLE, LV_PART_MAIN);
            lv_obj_set_style_bg_opa(d, LV_OPA_COVER, LV_PART_MAIN);
            lv_obj_set_style_bg_color(d, lv_color_hex(dot[st]), LV_PART_MAIN);
            lv_obj_clear_flag(d, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_align(d, LV_ALIGN_LEFT_MID, 16, 0);
            lv_obj_t *n = lv_label_create(row);
            lv_obj_set_style_text_font(n, f18, LV_PART_MAIN);
            lv_obj_set_style_text_color(n, lv_color_hex(st == 3 ? 0x8C8C8C : 0xFFFFFF), LV_PART_MAIN);
            lv_label_set_long_mode(n, LV_LABEL_LONG_DOT);
            lv_obj_set_width(n, 270);
            lv_label_set_text(n, r.was.c_str());
            lv_obj_align(n, LV_ALIGN_TOP_LEFT, 38, 7);
            std::string sub = art[r.tab < 0 || r.tab > 3 ? 0 : r.tab];
            if (!r.datum.empty()) sub += (sub.empty() ? "" : " · ") + r.datum;
            lv_obj_t *u = lv_label_create(row);
            lv_obj_set_style_text_font(u, f14, LV_PART_MAIN);
            lv_obj_set_style_text_color(u, lv_color_hex(0x5C5C5C), LV_PART_MAIN);
            lv_label_set_text(u, sub.c_str());
            lv_obj_align(u, LV_ALIGN_TOP_LEFT, 38, 31);
            lv_obj_t *w = lv_label_create(row);
            lv_obj_set_style_text_font(w, f18, LV_PART_MAIN);
            lv_obj_set_style_text_color(w, lv_color_hex(txt[st]), LV_PART_MAIN);
            lv_label_set_text(w, r.wann.c_str());
            lv_obj_align(w, LV_ALIGN_RIGHT_MID, -16, 0);
            lv_obj_add_event_cb(row, [](lv_event_t *e) {
              id(fd_jump)->execute((int) (intptr_t) lv_event_get_user_data(e));
            }, LV_EVENT_CLICKED, (void *) (intptr_t) i);
          }

  # Tipp auf eine Zeile: Liste zu, Unter-Tab zeigen, Zusatz bzw. Futtersorte auswählen
  - id: fd_jump
    parameters:
      i: int
    then:
      - lvgl.widget.hide: fd_overlay
      - if:
          condition:
            lambda: return i >= 0 && i < (int) id(fd_tab).size() && id(fd_tab)[i] >= 1 && id(fd_tab)[i] <= 3;
          then:
            - lambda: |-
                int k = id(fd_tab)[i] - 2;
                auto &e = id(fd_entry)[i];
                if (k >= 0 && !e.empty() && e != id(care_cur)[k]) {
                  id(care_pick)[k] = e;
                  id(care_val)[k] = 1.0f;
                }
            - script.execute:
                id: show_care
                v: !lambda return id(fd_tab)[i];

  - id: show_overview
    then:
      - lvgl.widget.hide: ed_overlay
      - lvgl.widget.hide: pk_overlay
      - lvgl.widget.hide: fp_overlay
      - lvgl.widget.hide: fd_overlay
      - lvgl.page.show: page_overview
      - lvgl.label.update: {id: hdr_tab_overview, text_color: 0xFFFFFF}
      - lvgl.label.update: {id: hdr_tab_control, text_color: 0x5C5C5C}
      - lvgl.label.update: {id: hdr_tab_water, text_color: 0x5C5C5C}
      - lvgl.widget.update: {id: hdr_underline, x: 92}

  - id: show_control
    then:
      - lvgl.widget.hide: ed_overlay
      - lvgl.widget.hide: pk_overlay
      - lvgl.widget.hide: fp_overlay
      - lvgl.widget.hide: fd_overlay
      - lvgl.page.show: page_control
      - lvgl.label.update: {id: hdr_tab_overview, text_color: 0x5C5C5C}
      - lvgl.label.update: {id: hdr_tab_control, text_color: 0xFFFFFF}
      - lvgl.label.update: {id: hdr_tab_water, text_color: 0x5C5C5C}
      - lvgl.widget.update: {id: hdr_underline, x: 200}

  - id: show_water
    then:
      - lvgl.widget.hide: ed_overlay
      - lvgl.widget.hide: pk_overlay
      - lvgl.widget.hide: fp_overlay
      - lvgl.widget.hide: fd_overlay
      - lvgl.page.show: page_water
      - lvgl.label.update: {id: hdr_tab_overview, text_color: 0x5C5C5C}
      - lvgl.label.update: {id: hdr_tab_control, text_color: 0x5C5C5C}
      - lvgl.label.update: {id: hdr_tab_water, text_color: 0xFFFFFF}
      - lvgl.widget.update: {id: hdr_underline, x: 312}

# ---------------------------------------------------------------------------
# UI: dark, black/white, accent only for "on", "new" and warnings
# ---------------------------------------------------------------------------
lvgl:
  displays:
    - tft
  touchscreens:
    - touch
  disp_bg_color: 0x000000
  default_font: inter_18
  theme:
    label:
      text_color: 0xFFFFFF
    obj:
      bg_color: 0x121212
      border_width: 0
      radius: 16
      pad_all: 0
      scrollbar_mode: "OFF"
    button:
      bg_color: 0x121212
      border_width: 0
      radius: 16
      shadow_width: 0
      pad_all: 0
      pressed:
        bg_color: 0x1E1E1E

  # header, shown on every page: title on the start page, inside a tank the
  # back button (with the short tank name) and the page tabs; clock on the right
  top_layer:
    widgets:
      - obj:
          x: 0
          y: 0
          width: 480
          height: 56
          radius: 0
          bg_color: 0x000000
          widgets:
            - label: {id: hdr_title, x: 16, y: 18, text: "Aquarien", text_color: 0xFFFFFF}
            - obj:
                id: hdr_nav
                hidden: true
                x: 0
                y: 0
                width: 400
                height: 56
                radius: 0
                bg_opa: TRANSP
                widgets:
                  - button:
                      x: 0
                      y: 0
                      width: 76
                      height: 56
                      bg_opa: TRANSP
                      pressed:
                        bg_opa: TRANSP
                      on_click:
                        - script.execute: show_start
                      widgets:
                        # Pfeil oben, Kurzname darunter (z. B. "Garnelen" passt nicht daneben)
                        - label: {x: 2, y: 2, width: 72, text_align: CENTER, text: "\U000F0141", text_font: mdi_24, text_color: 0x8C8C8C}
                        - label: {id: hdr_tank, x: 2, y: 30, width: 72, long_mode: DOT, text_align: CENTER, text: "", text_font: inter_14, text_color: 0xD9A920}
                  - button:
                      x: 76
                      y: 0
                      width: 112
                      height: 56
                      bg_opa: TRANSP
                      pressed:
                        bg_opa: TRANSP
                      on_click:
                        - script.execute: show_overview
                      widgets:
                        - label: {id: hdr_tab_overview, x: 16, y: 18, text: "Übersicht", text_color: 0xFFFFFF}
                  - button:
                      x: 188
                      y: 0
                      width: 112
                      height: 56
                      bg_opa: TRANSP
                      pressed:
                        bg_opa: TRANSP
                      on_click:
                        - script.execute: show_control
                      widgets:
                        - label: {id: hdr_tab_control, x: 12, y: 18, text: "Steuerung", text_color: 0x5C5C5C}
                  - button:
                      x: 300
                      y: 0
                      width: 96
                      height: 56
                      bg_opa: TRANSP
                      pressed:
                        bg_opa: TRANSP
                      # kurz: Tab zeigen; lang: dazu die Liste "Fälligkeiten" (on_short_click,
                      # weil LVGL nach einem langen Druck auch "click" meldet)
                      on_short_click:
                        - script.execute: show_water
                      on_long_press:
                        - script.execute: show_water
                        - script.execute: fd_open
                      widgets:
                        - label: {id: hdr_tab_water, x: 12, y: 18, text: "Pflege", text_color: 0x5C5C5C}
                  - obj:
                      id: hdr_underline
                      x: 92
                      y: 46
                      width: 24
                      height: 3
                      radius: 2
                      bg_color: 0xD9A920
            - label:
                id: hdr_clock
                align: TOP_RIGHT
                x: -16
                y: 18
                text: ""
                text_color: 0x8C8C8C

  pages:
    # ---------------------------------------------------------------- Start
    # pro Becken eine Karte (Garnelen links, Plants rechts): oben das Becken als
    # animierter 8-Bit-Würfel (Canvas, 26 px unter der Kartenkante, gezeichnet im interval oben), darüber Name und
    # Messwerte, darunter Wasserwechsel, Zugabe und Status. Tippen öffnet das Becken,
    # langer Druck auf Lampe bzw. Diffusor schaltet Licht bzw. CO2 (Skript tank_touch).
    - id: page_start
      bg_color: 0x000000
      scrollable: false
      widgets:
        - button:
            x: 6
            y: 56
            width: 232
            height: 420
            radius: 12
            clip_corner: true
            bg_color: 0x05060A
            pressed:
              bg_color: 0x0C0E16
            on_press:
              - script.execute: {id: tank_touch, n: 0, phase: 0}
            on_release:
              - script.execute: {id: tank_touch, n: 0, phase: 1}
            on_long_press:
              - script.execute: {id: tank_touch, n: 0, phase: 2}
            on_short_click:
              - script.execute: {id: open_tank, n: 0}
            widgets:
              - canvas: {id: st0_canvas, x: 0, y: 26, width: 232, height: 324}
              - label: {id: st0_name, x: 10, y: 6, width: 212, long_mode: DOT, text: "--", text_font: inter_14}
              # Messwerte wie in der HA-Karte: Wert weiss, darunter die Veränderung grau.
              # Links Temperatur (24 h), rechts TDS (seit Wasserwechsel)
              - label: {id: st0_temp, x: 10, y: 25, text: "", text_font: inter_14}
              - label: {id: st0_temp_d, x: 10, y: 42, text: "", text_font: inter_14, text_color: 0x8C8C8C}
              - label: {id: st0_tds, align: TOP_RIGHT, x: -10, y: 25, text: "", text_font: inter_14}
              - label: {id: st0_tds_d, align: TOP_RIGHT, x: -10, y: 42, text: "", text_font: inter_14, text_color: 0x8C8C8C}
              - obj: {id: st0_ww_dot, x: 12, y: 351, width: 6, height: 6, radius: 3, bg_color: 0x5C5C5C}
              - label: {id: st0_ww, x: 26, y: 344, width: 196, height: 18, long_mode: DOT, text: "Wasserwechsel --", text_font: inter_14}
              - obj: {id: st0_dose_dot, x: 12, y: 369, width: 6, height: 6, radius: 3, bg_color: 0x5C5C5C}
              - label: {id: st0_dose, x: 26, y: 362, width: 196, height: 18, long_mode: DOT, text: "Zugabe --", text_font: inter_14}
              - obj: {id: st0_food_dot, x: 12, y: 387, width: 6, height: 6, radius: 3, bg_color: 0x5C5C5C}
              - label: {id: st0_food, x: 26, y: 380, width: 196, height: 18, long_mode: DOT, text: "Fütterung --", text_font: inter_14}
              - obj: {id: st0_status_dot, x: 12, y: 405, width: 6, height: 6, radius: 3, bg_color: 0x5C5C5C}
              - label: {id: st0_status, x: 26, y: 398, width: 196, height: 18, long_mode: DOT, text: "--", text_font: inter_14}
        - button:
            x: 242
            y: 56
            width: 232
            height: 420
            radius: 12
            clip_corner: true
            bg_color: 0x05060A
            pressed:
              bg_color: 0x0C0E16
            on_press:
              - script.execute: {id: tank_touch, n: 1, phase: 0}
            on_release:
              - script.execute: {id: tank_touch, n: 1, phase: 1}
            on_long_press:
              - script.execute: {id: tank_touch, n: 1, phase: 2}
            on_short_click:
              - script.execute: {id: open_tank, n: 1}
            widgets:
              - canvas: {id: st1_canvas, x: 0, y: 26, width: 232, height: 324}
              - label: {id: st1_name, x: 10, y: 6, width: 212, long_mode: DOT, text: "--", text_font: inter_14}
              # Messwerte wie in der HA-Karte: Wert weiss, darunter die Veränderung grau.
              # Links Temperatur (24 h), rechts TDS (seit Wasserwechsel)
              - label: {id: st1_temp, x: 10, y: 25, text: "", text_font: inter_14}
              - label: {id: st1_temp_d, x: 10, y: 42, text: "", text_font: inter_14, text_color: 0x8C8C8C}
              - label: {id: st1_tds, align: TOP_RIGHT, x: -10, y: 25, text: "", text_font: inter_14}
              - label: {id: st1_tds_d, align: TOP_RIGHT, x: -10, y: 42, text: "", text_font: inter_14, text_color: 0x8C8C8C}
              - obj: {id: st1_ww_dot, x: 12, y: 351, width: 6, height: 6, radius: 3, bg_color: 0x5C5C5C}
              - label: {id: st1_ww, x: 26, y: 344, width: 196, height: 18, long_mode: DOT, text: "Wasserwechsel --", text_font: inter_14}
              - obj: {id: st1_dose_dot, x: 12, y: 369, width: 6, height: 6, radius: 3, bg_color: 0x5C5C5C}
              - label: {id: st1_dose, x: 26, y: 362, width: 196, height: 18, long_mode: DOT, text: "Zugabe --", text_font: inter_14}
              - obj: {id: st1_food_dot, x: 12, y: 387, width: 6, height: 6, radius: 3, bg_color: 0x5C5C5C}
              - label: {id: st1_food, x: 26, y: 380, width: 196, height: 18, long_mode: DOT, text: "Fütterung --", text_font: inter_14}
              - obj: {id: st1_status_dot, x: 12, y: 405, width: 6, height: 6, radius: 3, bg_color: 0x5C5C5C}
              - label: {id: st1_status, x: 26, y: 398, width: 196, height: 18, long_mode: DOT, text: "--", text_font: inter_14}

    # ---------------------------------------------------------------- Übersicht
    - id: page_overview
      bg_color: 0x000000
      scrollable: false
      widgets:
        # Wassertemperatur
        - obj:
            x: 16
            y: 68
            width: 216
            height: 150
            widgets:
              - label: {x: 18, y: 16, text: "WASSER", text_font: inter_14, text_color: 0x8C8C8C}
              - label: {id: ov_water_temp, x: 14, y: 40, text: "--", text_font: inter_56}
              - label: {x: 150, y: 52, text: "°C", text_font: inter_18, text_color: 0x8C8C8C}
              - label: {id: ov_room, x: 18, y: 118, text: "Raum --", text_font: inter_14, text_color: 0x8C8C8C}

        # TDS
        - obj:
            x: 248
            y: 68
            width: 216
            height: 150
            widgets:
              - label: {x: 18, y: 16, text: "TDS", text_font: inter_14, text_color: 0x8C8C8C}
              - label: {id: ov_tds, x: 14, y: 40, text: "--", text_font: inter_56}
              - label: {x: 150, y: 52, text: "ppm", text_font: inter_18, text_color: 0x8C8C8C}
              - label: {id: ov_tds_rise, x: 18, y: 118, text: "Seit Wasserwechsel: --", text_font: inter_14, text_color: 0x8C8C8C}

        # Geräte (nur Anzeige, Tippen öffnet die Steuerung)
        - button:
            x: 16
            y: 230
            width: 141
            height: 64
            on_click:
              - script.execute: show_control
            widgets:
              - label: {id: ov_light_icon, x: 14, y: 20, text: "\U000F0335", text_font: mdi_24, text_color: 0x5C5C5C}
