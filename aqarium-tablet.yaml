        # -------- Wasserwechsel: Schnellwahl oder -/+ in 0,5-L-Schritten
        - obj:
            id: ww_view
            hidden: true
            x: 0
            y: 112
            width: 480
            height: 368
            radius: 0
            bg_opa: TRANSP
            widgets:
              - obj:
                  x: 16
                  y: 0
                  width: 448
                  height: 120
                  widgets:
                    - label: {x: 18, y: 14, text: "Gewechselte Menge", text_font: inter_14, text_color: 0x8C8C8C}
                    - obj:
                        x: 18
                        y: 34
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        layout:
                          type: flex
                          flex_flow: ROW
                          flex_align_cross: END
                          pad_column: 4
                        widgets:
                          - label: {id: ww_val, text: "--", text_font: inter_56}
                          - label: {text: "L", text_font: inter_22, text_color: 0x8C8C8C, pad_bottom: 10}
                    - label: {id: ww_liters, x: 18, y: 96, text: "", text_font: inter_14, text_color: 0x8C8C8C}
                    - button:
                        x: 284
                        y: 28
                        width: 64
                        height: 64
                        radius: 32
                        bg_color: 0x1E1E1E
                        on_click:
                          - lambda: |-
                              id(ww_liter) = std::max(0.5f, id(ww_liter) - 0.5f);
                              id(ww_touched) = true;
                          - script.execute: refresh_ww
                        widgets:
                          - label: {align: CENTER, text: "-", text_font: inter_32}
                    - button:
                        x: 364
                        y: 28
                        width: 64
                        height: 64
                        radius: 32
                        bg_color: 0x1E1E1E
                        on_click:
                          - lambda: |-
                              float vol = (id(tank) ? id(ha1_volume) : id(ha_volume))->state;
                              float max_l = (isnan(vol) || vol <= 0) ? 200.0f : vol;
                              id(ww_liter) = std::min(max_l, id(ww_liter) + 0.5f);
                              id(ww_touched) = true;
                          - script.execute: refresh_ww
                        widgets:
                          - label: {align: CENTER, text: "+", text_font: inter_32}

              # Schnellwahl
              - button:
                  id: ww_chip_1
                  x: 16
                  y: 132
                  width: 68
                  height: 56
