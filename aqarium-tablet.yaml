substitutions:
  # Home Assistant entities
  light_entity: switch.aqarium_aqarium_licht_aquarium_licht
  co2_entity: switch.aqarium_co2_anlage
  pump_entity: switch.aquarium_stecker_aquariumpumpe_pwm
  power_entity: sensor.aqarium_din_rail_3_leistung
  water_temp_entity: sensor.aquarium_aquarium_monitor_water_temperature
  tds_entity: sensor.aquarium_aquarium_monitor_tds
  tds_rise_entity: sensor.aquarium_aquarium_monitor_tds_rise_since_water_change
  # Veränderung der Wassertemperatur seit 24 h (HA packages/aquarium_monitor.yaml)
  water_temp_24h_entity: sensor.aquarium_wassertemperatur_anderung_24h
  tds_jump_entity: binary_sensor.aquarium_aquarium_monitor_tds_jump
  tds_high_entity: binary_sensor.aquarium_aquarium_monitor_water_change_recommended
  room_temp_entity: sensor.aquarium_aquarium_monitor_temperature
  room_humidity_entity: sensor.aquarium_aquarium_monitor_humidity
  motion_entity: binary_sensor.bewegungsmelder_aqara_occupancy
  # Becken 1 (Nano Cube Plants): bisher ist nur das Licht smart
  tank1_light_entity: switch.aquarium_nano_cube_plants_led

  # Display sleep: off after this long without touch or motion,
  # motion does not wake the display during the night (touch always does)
  sleep_after_ms: "180000"
  night_start_hour: "23"
  night_end_hour: "7"

  # Startseite: Abstand zwischen zwei Bildern der Becken-Animation (100 ms = 10 Bilder/s).
  # Reagiert das Tablet auf der Startseite träge, auf 150 oder 200 erhöhen.
  pixel_frame_ms: "200"

  # Display-Helligkeit in % (10-100)
  display_brightness: "100"

# Home-Assistant-Daten pro Becken (Wasserwerte, Wasserwechsel, Zugabe, Name),
# siehe common/aquarium-tablet-becken.yaml. Becken 0 = "aquarium" (Nano Cube Garnelen),
# Becken 1 = "aquarium1" (Nano Cube Plants). Die Hardware-Entitäten oben gehören zu
# Becken 0; die Hardware von Becken 1 wird später eingebunden.
packages:
  becken0: !include {file: common/aquarium-tablet-becken.yaml, vars: {s: "", n: "0"}}
  becken1: !include {file: common/aquarium-tablet-becken.yaml, vars: {s: "1", n: "1"}}

esphome:
  name: aquarium-display
  friendly_name: Aquarium Display
  # Startseite: Becken als animierter 8-Bit-Würfel wie die HA-Karte aquarium-pixel-card.
  # aquarium_pixel_data.h wird im HA-Repo erzeugt (tools/aquarium_pixel_tablet_export.js).
  includes:
    - common/aquarium_pixel.h
    - common/aquarium_pixel_data.h
    # Tab "Pflege": Zusätze und Futter
    - common/aquarium_pflege.h
  on_boot:
    priority: -100
    then:
      - light.control:
          id: backlight
          brightness: !lambda return std::max(10.0f, std::min(100.0f, (float) ${display_brightness})) / 100.0f;

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret aquarium_display__encryption_key
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: refresh_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: refresh_clock
          - script.execute: refresh_night
          - script.execute: refresh_dose
      # anti-burn pixel training while the display sleeps (same times as the CYD)
      - hours: 2,5,8
        minutes: 5
        seconds: 0
        then:
          - if:
              condition:
                light.is_off: backlight
              then:
                - logger.log: "Starting anti-burn pixel training"
                - lvgl.resume:
                - lvgl.pause:
                    show_snow: true
      - hours: 2,5,8
        minutes: 35
        seconds: 0
        then:
          - if:
              condition:
                light.is_off: backlight
              then:
                - logger.log: "Stopping anti-burn pixel training"
                - lvgl.resume:
                - lvgl.pause:

# Display sleep: the backlight state is the sleep state. While it is off, LVGL is
# paused, so the first tap only wakes the display and does not press a button.
interval:
  - interval: 5s
    then:
      - if:
          condition:
            and:
              - light.is_on: backlight
              - lambda: |-
                  if (millis() - id(last_activity) < ${sleep_after_ms}) return false;
                  return id(is_night) || !id(ha_motion).state;
          then:
            - light.turn_off: backlight

  # Startseite: Becken animieren (common/aquarium_pixel.h), nur sichtbar und bei Display an.
  # Zustände wie in der HA-Karte: Licht aus = Mondlicht, CO2 aus = keine Bläschen,
  # Pumpe aus = ruhige Oberfläche, Wasserwechsel überfällig = trübes Wasser,
  # Warnung oder Werte ausser Soll = blinkendes "!", Wartung oder Fütterungspause = Sanduhr
  # (leert sich mit der Restzeit), nach dem Füttern 30 min Futter am Boden (Garnelen fressen),
  # nachts ruhen die Garnelen. Becken 1 hat bisher nur Licht;
  # CO2 und Pumpe gelten dort als an.
  - interval: ${pixel_frame_ms}ms
    then:
      - lambda: |-
          if (!id(start_visible) || !id(backlight).remote_values.is_on()) return;
          static uint32_t last = 0;
          uint32_t now = millis();
          float dt = last ? std::min(0.1f, (now - last) / 1000.f) : 0.1f;
          last = now;
          if (!aq_tank[0].ready()) { aq_tank[0].init(&aqpx::garnelen); aq_tank[1].init(&aqpx::plants); }
          auto on = [](binary_sensor::BinarySensor *b) { return !b->has_state() || b->state; };
          for (int n = 0; n < 2; n++) {
            float due = (n ? id(ha1_water_change_due) : id(ha_water_change_due))->state;
            float oor = (n ? id(ha1_out_of_range_count) : id(ha_out_of_range_count))->state;
            float nw = (n ? id(ha1_warn_count) : id(ha_warn_count))->state;
            bool warn = (!isnan(oor) && oor >= 1) || (!isnan(nw) && nw >= 1) ||
                        (n == 0 && (id(ha_tds_jump).state || id(ha_tds_high).state));
            bool murk = !isnan(due) && due < 0;
            if (n == 0) aq_tank[0].set_target(on(id(ha_light)), on(id(ha_co2)), on(id(ha_pump)), murk, warn);
            else aq_tank[1].set_target(on(id(ha1_light)), true, true, murk, warn);
            // Sanduhr: Anteil der verbleibenden Zeit von Wartung bzw. Fütterungspause
            float rest = (n ? id(ha1_wartung_rest) : id(ha_wartung_rest))->state;
            float dauer = (n ? id(ha1_wartung_dauer) : id(ha_wartung_dauer))->state;
            bool pause = (n ? id(ha1_wartung) : id(ha_wartung))->state && !isnan(rest) && !isnan(dauer) && dauer > 0;
            aq_tank[n].set_pause(pause ? rest / dauer : -1);
            // Futter nach dem Füttern (30 min sichtbar, frisch = sinkt ab)
            float fr = (n ? id(ha1_futter_rest) : id(ha_futter_rest))->state;
            auto &fb = (n ? id(ha1_futter_bild) : id(ha_futter_bild))->state;
            int fk = fb == "sticks" ? aqpx::FOOD_STICKS : fb == "gemuese" ? aqpx::FOOD_GEMUESE
                   : fb == "pulver" ? aqpx::FOOD_PULVER : fb == "tablette" ? aqpx::FOOD_TABLETTE : aqpx::FOOD_NONE;
            aq_tank[n].set_food(isnan(fr) ? aqpx::FOOD_NONE : fk, isnan(fr) ? 0 : fr / 30, !isnan(fr) && fr >= 29);
            lv_obj_t *cv = (lv_obj_t *) (n ? id(st1_canvas) : id(st0_canvas));
            lv_draw_buf_t *db = lv_canvas_get_draw_buf(cv);
            if (db == nullptr) continue;
            aq_tank[n].render(now, dt, (uint16_t *) db->data, db->header.stride / 2,
                              [](uint8_t r, uint8_t g, uint8_t b) -> uint16_t { return lv_color_to_u16(lv_color_make(r, g, b)); });
            lv_obj_invalidate(cv);
          }

globals:
  # water test entered on the tablet, not yet saved: pH, KH, NO2, NO3, NH4 ("" = not measured)
  - id: pending
    type: std::vector<std::string>
    initial_value: std::vector<std::string>(5)
  # subtitle per water tile ("zuletzt 12.10." / "neu"), incl. CO2
  - id: wt_sub
    type: std::vector<std::string>
    initial_value: std::vector<std::string>(6)
  # parameter currently open in the editor (index into pending)
  - id: edit_param
    type: int
    initial_value: "0"
  # millis() of the last touch, motion change or wake-up
  - id: last_activity
    type: uint32_t
    initial_value: "0"
  # night mode: motion does not wake the display
  - id: is_night
    type: bool
    initial_value: "false"
  # water change amount in litres picked on the tablet; follows the default
  # from HA (input_number.aq_ww_liter, set from einstellungen.yaml) until touched
  - id: ww_liter
    type: float
    initial_value: "5.0"
  - id: ww_touched
    type: bool
    initial_value: "false"
  # days until the next dose per tank (INT_MIN = unknown)
  - id: dose_days
    type: std::vector<int>
    initial_value: std::vector<int>(2, INT_MIN)
  # active tank: 0 = "aquarium" (Nano Cube Garnelen), 1 = "aquarium1" (Nano Cube Plants)
  - id: tank
    type: int
    initial_value: "0"
  # Tab "Pflege", je [0] Zugabe und [1] Futter: vom Benutzer gewählter Eintrag
  # ("" = Vorschlag aus HA), angezeigter Eintrag, dessen Schritt, Menge, Zeitpunkt
  # des letzten Speicherns
  - id: care_pick
    type: std::vector<std::string>
    initial_value: std::vector<std::string>(2)
  - id: care_cur
    type: std::vector<std::string>
    initial_value: std::vector<std::string>(2)
  - id: care_step
    type: std::vector<float>
    initial_value: std::vector<float>(2, 0.5f)
  - id: care_val
    type: std::vector<float>
    initial_value: std::vector<float>(2, 1.0f)
  - id: care_saved
    type: std::vector<uint32_t>
    initial_value: std::vector<uint32_t>(2, 0)
  # Liste "Fälligkeiten": je angezeigte Zeile Unter-Tab und Eintrag (für den Sprung)
  - id: fd_tab
    type: std::vector<int>
  - id: fd_entry
    type: std::vector<std::string>
  # Fütterungspause: angebotene Minuten nach dem Speichern einer Fütterung (0 = nicht fragen)
  - id: fp_min
    type: int
    initial_value: "0"
  # Dauer des zuletzt gedrückten Wartungsknopfs in Minuten
  - id: maint_min
    type: int
    initial_value: "0"
  # Auswahl offen für: 0 = Zugabe, 1 = Futter
  - id: care_kind
    type: int
    initial_value: "0"
  # Startseite sichtbar: nur dann laufen die Becken-Animationen
  - id: start_visible
    type: bool
    initial_value: "true"
  # Entität, die ein langer Druck auf der Startseite umschaltet ("" = keine)
  - id: press_entity
    type: std::string
    initial_value: '""'

# Colors: background 0x000000, tile 0x121212, text 0xFFFFFF / 0x8C8C8C / 0x5C5C5C,
# accent 0xD9A920 dark yellow (on, new); status traffic light: ok 0x4CAF50, warning 0xFF7A3D, alert 0xFF5C5C
font:
  - file: "gfonts://Inter@400"
    id: inter_14
    size: 14
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@500"
    id: inter_18
    size: 18
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@500"
    id: inter_22
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@400"
    id: inter_32
    size: 32
    bpp: 4
    glyphs: "0123456789.,+-%"
  - file: "gfonts://Inter@300"
    id: inter_56
    size: 56
    bpp: 4
    glyphs: "0123456789.,+-%"
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: mdi_24
    size: 24
    bpp: 4
    glyphs:
      - "\U000F0335" # lightbulb
      - "\U000F07E4" # molecule-co2
      - "\U000F1402" # pump
      - "\U000F0026" # alert
      - "\U000F05E1" # check-circle-outline
      - "\U000F0141" # chevron-left
      - "\U000F0142" # chevron-right
      - "\U000F0156" # close (Liste Fälligkeiten)
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: mdi_28
    size: 28
    bpp: 4
    glyphs:
      - "\U000F0335" # lightbulb
      - "\U000F07E4" # molecule-co2
      - "\U000F1402" # pump
      - "\U000F05B7" # wrench
      - "\U000F051F" # timer-sand (Rückfrage Fütterungspause)

# Display-SPI (nur für die Init-Befehle des ST7701S)
spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  sda: GPIO19
  scl: GPIO45
  frequency: 400kHz

# Backlight
output:
  - platform: ledc
    pin: GPIO38
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: backlight
    restore_mode: ALWAYS_ON
    # also covers switching the backlight from Home Assistant
    on_turn_on:
      - lambda: id(last_activity) = millis();
      # after waking always start on the start page
      - script.execute: show_start
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
    on_turn_off:
      - lvgl.pause:

# Board preset: pins, pclk polarity, 18 bit mode and panel init for the 4848S040.
# The generic ST7701S preset (480x864 panel) caused a blurry, shimmering picture.
display:
  - platform: mipi_rgb
    model: GUITION-4848S040
    id: tft
    update_interval: never
    auto_clear_enabled: false
    spi_id: lcd_spi
    # keep the orientation of the previous setup (preset default is mirrored)
    transform:
      mirror_x: false
      mirror_y: false

touchscreen:
  - platform: gt911
    id: touch
    address: 0x5D
    transform:
      mirror_x: false
      mirror_y: false
    on_touch:
      - lambda: id(last_activity) = millis();
    # wake on release, so the waking tap never reaches a button
    on_release:
      - if:
          condition:
            light.is_off: backlight
          then:
            - light.turn_on: backlight

# ---------------------------------------------------------------------------
# Home Assistant states
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: homeassistant
    id: ha_motion
    entity_id: ${motion_entity}
    trigger_on_initial_state: true
    on_state:
      - script.execute: refresh_night
      - if:
          condition:
            lambda: return !id(is_night);
          then:
            # motion start and end both restart the countdown
            - lambda: id(last_activity) = millis();
            - if:
                condition:
                  and:
                    - lambda: return x;
                    - light.is_off: backlight
                then:
                  - light.turn_on: backlight

  - platform: homeassistant
    id: ha_light
    entity_id: ${light_entity}
    trigger_on_initial_state: true
    on_state:
      - script.execute: refresh_hw

  - platform: homeassistant
    id: ha_co2
    entity_id: ${co2_entity}
    trigger_on_initial_state: true
    on_state:
      - script.execute: refresh_hw

  - platform: homeassistant
    id: ha_pump
    entity_id: ${pump_entity}
    trigger_on_initial_state: true
    on_state:
      - script.execute: refresh_hw

  # Licht von Becken 1, bisher nur für die Startseite (Mondlicht, langer Druck)
  - platform: homeassistant
    id: ha1_light
    entity_id: ${tank1_light_entity}

  - platform: homeassistant
    id: ha_tds_jump
    entity_id: ${tds_jump_entity}
    trigger_on_initial_state: true
    on_state:
      - script.execute: refresh_status

  - platform: homeassistant
    id: ha_tds_high
    entity_id: ${tds_high_entity}
    trigger_on_initial_state: true
    on_state:
      - script.execute: refresh_status

sensor:
  - platform: homeassistant
    id: ha_water_temp
    entity_id: ${water_temp_entity}
    on_value:
      - script.execute: refresh_hw
      - script.execute: refresh_start_values

  - platform: homeassistant
    id: ha_tds
    entity_id: ${tds_entity}
    on_value:
      - script.execute: refresh_hw
      - script.execute: refresh_start_values

  - platform: homeassistant
    id: ha_tds_rise
    entity_id: ${tds_rise_entity}
    on_value:
      - script.execute: refresh_hw
      - script.execute: refresh_start_values

  - platform: homeassistant
    id: ha_water_temp_24h
    entity_id: ${water_temp_24h_entity}
    on_value:
      - script.execute: refresh_start_values

  - platform: homeassistant
    id: ha_room_temp
    entity_id: ${room_temp_entity}
    on_value:
      - script.execute: refresh_room

  - platform: homeassistant
    id: ha_room_humidity
    entity_id: ${room_humidity_entity}
    on_value:
      - script.execute: refresh_room

  - platform: homeassistant
    id: ha_power
    entity_id: ${power_entity}
    on_value:
      - script.execute: refresh_hw


# ---------------------------------------------------------------------------
# UI refresh
# ---------------------------------------------------------------------------
script:
  - id: refresh_night
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          id(is_night) = now.is_valid() &&
              (now.hour >= ${night_start_hour} || now.hour < ${night_end_hour});

  - id: refresh_clock
    then:
      - lvgl.label.update:
          id: hdr_clock
          text: !lambda |-
            auto now = id(ha_time).now();
            return now.is_valid() ? now.strftime("%H:%M") : std::string("");

  - id: refresh_room
    then:
      - lvgl.label.update:
          id: ov_room
          text: !lambda |-
            float t = id(ha_room_temp).state;
            float h = id(ha_room_humidity).state;
            // Sensoren des Aquarium Monitors gehören zu Becken 0
            if (id(tank) != 0 || isnan(t)) return std::string("Raum --");
            if (isnan(h)) return str_sprintf("Raum %.1f °C", t);
            return str_sprintf("Raum %.1f °C · %.0f %%", t, h);

  # most important message first: TDS jump > TDS high > tests out of range > ok
  - id: refresh_status
    then:
      - if:
          condition:
            lambda: return id(tank) == 0 && id(ha_tds_jump).state;
          then:
            - lvgl.label.update: {id: ov_status_icon, text: "\U000F0026", text_color: 0xFF5C5C}
            - lvgl.label.update: {id: ov_status_text, text: "TDS-Sprung erkannt", text_color: 0xFF5C5C}
          else:
            - if:
                condition:
                  lambda: return id(tank) == 0 && id(ha_tds_high).state;
                then:
                  - lvgl.label.update: {id: ov_status_icon, text: "\U000F0026", text_color: 0xFF7A3D}
                  - lvgl.label.update: {id: ov_status_text, text: "TDS zu hoch", text_color: 0xFF7A3D}
                else:
                  # Warnungen aus HA (Temperatur, Pumpe, CO2, ...): wichtigste mit Anzahl weiterer
                  - if:
                      condition:
                        lambda: |-
                          return (id(tank) ? id(ha1_warn_count) : id(ha_warn_count))->state >= 1;
                      then:
                        - lvgl.label.update: {id: ov_status_icon, text: "\U000F0026", text_color: 0xFF7A3D}
                        - lvgl.label.update:
                            id: ov_status_text
                            text_color: 0xFF7A3D
                            text: !lambda |-
                              int n = (int) (id(tank) ? id(ha1_warn_count) : id(ha_warn_count))->state;
                              std::string t = (id(tank) ? id(ha1_warn_text) : id(ha_warn_text))->state;
                              if (t.empty() || t == "unknown") t = str_sprintf("%d Warnungen", n);
                              else if (n > 1) t += str_sprintf(" (+%d)", n - 1);
                              return t;
                      else:
                        - if:
                            condition:
                              lambda: |-
                                return (id(tank) ? id(ha1_out_of_range_count) : id(ha_out_of_range_count))->state >= 1;
                            then:
                              - lvgl.label.update: {id: ov_status_icon, text: "\U000F0026", text_color: 0xFF7A3D}
                              - lvgl.label.update:
                                  id: ov_status_text
                                  text_color: 0xFF7A3D
                                  text: !lambda |-
                                    int n = (int) (id(tank) ? id(ha1_out_of_range_count) : id(ha_out_of_range_count))->state;
                                    return n == 1 ? std::string("1 Wert ausser Soll") : str_sprintf("%d Werte ausser Soll", n);
                            else:
                              # traffic light: ok green, warning orange, alert red
                              - lvgl.label.update: {id: ov_status_icon, text: "\U000F05E1", text_color: 0x4CAF50}
                              - lvgl.label.update: {id: ov_status_text, text: "Alles in Ordnung", text_color: 0xFFFFFF}
      - lvgl.label.update:
          id: ov_tds_rise
          text_color: !lambda |-
            return (id(tank) == 0 && id(ha_tds_high).state) ? lv_color_hex(0xFF7A3D) : lv_color_hex(0x8C8C8C);

  - id: refresh_water_change
    then:
      - lvgl.label.update:
          id: ov_ww
          text: !lambda |-
            float d = (id(tank) ? id(ha1_water_change_due) : id(ha_water_change_due))->state;
            if (isnan(d)) return std::string("--");
            int n = (int) d;
            if (n > 1) return str_sprintf("in %d Tagen", n);
            if (n == 1) return std::string("morgen");
            if (n == 0) return std::string("heute");
            return n == -1 ? std::string("seit 1 Tag fällig") : str_sprintf("seit %d Tagen fällig", -n);
          text_color: !lambda |-
            float d = (id(tank) ? id(ha1_water_change_due) : id(ha_water_change_due))->state;
            return (!isnan(d) && d <= 0) ? lv_color_hex(0xFF7A3D) : lv_color_hex(0xFFFFFF);

  # next dose from the logbook: days until due per tank, compared by local calendar date
  - id: refresh_dose
    then:
      - lambda: |-
          auto day_number = [](int y, int m, int d) -> int {
            y -= m <= 2;
            int era = (y >= 0 ? y : y - 399) / 400;
            int yoe = y - era * 400;
            int doy = (153 * (m + (m > 2 ? -3 : 9)) + 2) / 5 + d - 1;
            return era * 146097 + yoe * 365 + yoe / 4 - yoe / 100 + doy;
          };
          auto now = id(ha_time).now();
          const std::string *due[] = {&id(ha_next_dose).state, &id(ha1_next_dose).state};
          for (int t = 0; t < 2; t++) {
            int y, m, d;
            if (!now.is_valid() || sscanf(due[t]->c_str(), "%d-%d-%d", &y, &m, &d) != 3)
              id(dose_days)[t] = INT_MIN;
            else
              id(dose_days)[t] = day_number(y, m, d) - day_number(now.year, now.month, now.day_of_month);
          }
      - lvgl.label.update:
          id: ov_dose
          text: !lambda |-
            int n = id(dose_days)[id(tank)];
            if (n == INT_MIN) return std::string("--");
            if (n > 1) return str_sprintf("in %d Tagen", n);
            if (n == 1) return std::string("morgen");
            if (n == 0) return std::string("heute");
            return n == -1 ? std::string("seit 1 Tag fällig") : str_sprintf("seit %d Tagen fällig", -n);
          text_color: !lambda |-
            int n = id(dose_days)[id(tank)];
            return (n != INT_MIN && n <= 0) ? lv_color_hex(0xFF7A3D) : lv_color_hex(0xFFFFFF);
      - lvgl.label.update:
          id: ov_dose_product
          text: !lambda |-
            auto &p = (id(tank) ? id(ha1_next_dose_product) : id(ha_next_dose_product))->state;
            return (p.empty() || p == "unknown") ? std::string("Zugabe") : p;
      - script.execute: refresh_start

