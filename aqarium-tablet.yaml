              - label: {id: ov_pump_state, x: 50, y: 33, text: "--", text_font: inter_14, text_color: 0x8C8C8C}

        # Leistung
        - obj:
            x: 16
            y: 306
            width: 141
            height: 80
            widgets:
              - label: {x: 14, y: 12, text: "Leistung", text_font: inter_14, text_color: 0x8C8C8C}
