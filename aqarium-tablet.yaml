                  width: 64
                  height: 34
                  clickable: false
                  bg_color: 0x2A2A2A
                  indicator:
                    bg_color: 0x2A2A2A
                    checked:
                      bg_color: 0xD9A920
                  knob:
                    bg_color: 0xFFFFFF

        - button:
            x: 16
            y: 172
            width: 448
            height: 92
            on_click:
              - if:
                  condition:
                    lambda: return id(tank) == 0;
                  then:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data:
                          entity_id: ${co2_entity}
            widgets:
              - obj:
                  x: 20
                  y: 20
                  width: 52
                  height: 52
                  radius: 26
                  bg_color: 0x1E1E1E
                  clickable: false
                  widgets:
                    - label: {id: ctl_co2_icon, align: CENTER, text: "\U000F07E4", text_font: mdi_28, text_color: 0x5C5C5C}
              - label: {x: 90, y: 18, text: "CO2-Anlage", text_font: inter_22}
              - label: {id: ctl_co2_state, x: 90, y: 52, text: "--", text_font: inter_14, text_color: 0x8C8C8C}
              - switch:
                  id: ctl_co2_switch
                  x: 364
                  y: 29
                  width: 64
                  height: 34
                  clickable: false
                  bg_color: 0x2A2A2A
                  indicator:
                    bg_color: 0x2A2A2A
                    checked:
                      bg_color: 0xD9A920
                  knob:
                    bg_color: 0xFFFFFF

        - button:
            x: 16
            y: 276
            width: 448
            height: 92
            on_click:
              - if:
                  condition:
                    lambda: return id(tank) == 0;
                  then:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data:
                          entity_id: ${pump_entity}
            widgets:
              - obj:
                  x: 20
                  y: 20
                  width: 52
                  height: 52
                  radius: 26
                  bg_color: 0x1E1E1E
                  clickable: false
                  widgets:
