        # Auswahl eines Werts (über der Seite, unter der Kopfzeile)
        - obj:
            id: ed_overlay
            hidden: true
            x: 0
            y: 56
            width: 480
            height: 424
            radius: 0
            bg_color: 0x000000
            widgets:
              - label: {id: ed_title, x: 24, y: 14, text: "", text_font: inter_22}
              - roller:
                  id: ed_roller
                  x: 90
                  y: 52
                  width: 300
                  height: 260
                  visible_row_count: 5
                  text_font: inter_32
                  text_align: CENTER
                  text_color: 0x5C5C5C
                  bg_color: 0x121212
                  border_width: 0
                  radius: 16
                  selected:
                    bg_color: 0x1E1E1E
                    text_color: 0xD9A920
                  options: ["6.0", "7.0", "8.0"]
              - button:
                  x: 16
                  y: 332
                  width: 140
                  height: 76
                  on_click:
                    - lambda: id(pending)[id(edit_param)].clear();
                    - lvgl.widget.hide: ed_overlay
                    - script.execute: refresh_water
                  widgets:
                    - label: {align: CENTER, text: "Leeren", text_color: 0x8C8C8C}
              - button:
                  x: 170
                  y: 332
                  width: 140
                  height: 76
                  on_click:
                    - lvgl.widget.hide: ed_overlay
                  widgets:
                    - label: {align: CENTER, text: "Abbrechen", text_color: 0x8C8C8C}
              - button:
                  x: 324
                  y: 332
                  width: 140
                  height: 76
                  bg_color: 0xD9A920
                  pressed:
                    bg_color: 0xB08A18
                  on_click:
                    - lambda: id(pending)[id(edit_param)] = id(ed_roller)->get_selected_text();
                    - lvgl.widget.hide: ed_overlay
                    - script.execute: refresh_water
                  widgets:
                    - label: {align: CENTER, text: "Übernehmen", text_color: 0x000000}

        # Rückfrage nach dem Speichern einer Fütterung (Skripte fp_ask, fp_answer)
        - obj:
            id: fp_overlay
            hidden: true
            x: 0
            y: 56
            width: 480
            height: 424
            radius: 0
            bg_color: 0x000000
            widgets:
              - obj:
                  x: 16
                  y: 16
                  width: 448
                  height: 300
                  widgets:
                    - obj:
                        x: 198
                        y: 28
                        width: 52
                        height: 52
                        radius: 26
                        bg_color: 0x1E1E1E
                        widgets:
                          - label: {align: CENTER, text: "\U000F051F", text_font: mdi_28, text_color: 0xFF7A3D}
                    - label: {x: 0, y: 100, width: 448, text_align: CENTER, text: "Fütterung gespeichert", text_font: inter_18, text_color: 0xD9A920}
                    - label: {id: fp_text, x: 32, y: 136, width: 384, text_align: CENTER, text: "", text_font: inter_22}
                    - label: {x: 0, y: 236, width: 448, text_align: CENTER, text: "Ohne Antwort schliesst sich das Fenster nach 20 s", text_font: inter_14, text_color: 0x8C8C8C}
              - button:
                  x: 16
                  y: 332
                  width: 216
                  height: 76
                  on_click:
                    - script.execute: {id: fp_answer, ja: false}
                  widgets:
                    - label: {align: CENTER, text: "Nein", text_color: 0x8C8C8C}
              - button:
                  x: 248
                  y: 332
                  width: 216
                  height: 76
                  bg_color: 0xFF7A3D
                  pressed:
                    bg_color: 0xC85A28
                  on_click:
                    - script.execute: {id: fp_answer, ja: true}
                  widgets:
                    - label: {id: fp_yes_label, align: CENTER, text: "Ja", text_color: 0x000000}

