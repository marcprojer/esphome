# Board: Seeed Studio XIAO ESP32C6 (Seeed Studio)
# Definition: definitions/boards/seeed_xiao_esp32c6/manifest.yaml

substitutions:
  # TDS jump: change of the 5 min average vs. the 1 h average
  tds_jump_threshold_pct: "10"
  # water change recommended once TDS rose this much above the post-change baseline
  tds_water_change_threshold_pct: "25"
  # DS18B20 addresses on the shared 1-wire bus (from the log: "Found devices" / "Address")
  # probe 1 = aquarium (Garnelen), probe 2 = aquarium1 (Plants), since 2026-11-21
  water_temp_1_address: "0x14000000da3ae028"
  water_temp_2_address: "0xd5000000da42cf28"
  # TDS boards are powered from a GPIO only while measuring, one after the other (settle
  # time after power on): less electrolysis at the probes, and no interference if the two
  # tanks are ever connected electrically (heater, pumps, shared ground)
  tds_settle_time: 3s
  # probe 2 matched to probe 1 (both in the same water 2026-11-18 to 11-21: +9.5 %),
  # so both tanks are comparable; replace once both are calibrated with buffer solution
  tds_2_factor: "0.913"

esphome:
  name: aquarium-monitor
  friendly_name: Aquarium Monitor
  includes:
    - common/aquarium_monitor.h

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "rUJREhbhaMu+rcNdMp2NNjBuDR/LiyyN+7rwOAofDBw="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Aquarium Monitor Fallback
    password: "MX0zKjfKwFcK"

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

globals:
  # TDS after the last water change and the HA timestamp it belongs to (survive reboots)
  - id: tds_baseline
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: water_change_timestamp
    type: uint32_t
    restore_value: true
    initial_value: "0"
  # same for probe 2 (aquarium1, Plants)
  - id: tds_baseline_2
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: water_change_timestamp_2
    type: uint32_t
    restore_value: true
    initial_value: "0"

script:
  # wait until the fresh water has mixed and settled before capturing the baseline
  - id: script_capture_tds_baseline
    mode: restart
    then:
      - delay: 30min
      - lambda: |-
          float tds = id(sensor_tds_1_avg_5min).state;
          if (isnan(tds)) {
            ESP_LOGW("tds", "Baseline not captured (no TDS value)");
            return;
          }
          id(tds_baseline) = tds;
          ESP_LOGI("tds", "Baseline captured: %.0f ppm", tds);
      - component.update: sensor_tds_1_rise

  - id: script_capture_tds_baseline_2
    mode: restart
    then:
      - delay: 30min
      - lambda: |-
          float tds = id(sensor_tds_2_avg_5min).state;
          if (isnan(tds)) {
            ESP_LOGW("tds", "Baseline 2 not captured (no TDS value)");
            return;
          }
          id(tds_baseline_2) = tds;
          ESP_LOGI("tds", "Baseline 2 captured: %.0f ppm", tds);
      - component.update: sensor_tds_2_rise

  # power one TDS board, let it settle, take 3 readings (median), power it off again
  - id: script_measure_tds
    mode: single
    then:
      - switch.turn_off: tds_2_power
      - switch.turn_on: tds_1_power
      - delay: ${tds_settle_time}
      - repeat:
          count: 3
          then:
            - component.update: sensor_tds_1_voltage
            - delay: 300ms
      - switch.turn_off: tds_1_power
      - component.update: sensor_tds_1
      - delay: 1s
      - switch.turn_on: tds_2_power
      - delay: ${tds_settle_time}
      - repeat:
          count: 3
          then:
            - component.update: sensor_tds_2_voltage
            - delay: 300ms
      - switch.turn_off: tds_2_power
      - component.update: sensor_tds_2

interval:
  - interval: 30s
    then:
      - script.execute: script_measure_tds

# power for the TDS boards (VCC / + of the board), only on while measuring
switch:
  - platform: gpio
    id: tds_1_power
    pin: GPIO22  # D4
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: tds_2_power
    pin: GPIO23  # D5
    internal: true
    restore_mode: ALWAYS_OFF

text_sensor:
  # water changes are logged in HA (packages/aquarium_logbuch.yaml), per tank
  - platform: homeassistant
    id: ha_water_change_time
    entity_id: sensor.aquarium_wasserwechsel_zeitpunkt
    internal: true
    on_value:
      then:
        - lambda: |-
            int r = aqmon::water_change(x, id(water_change_timestamp), id(ha_time).now());
            if (r < 0) {
              // logged long after the fact: the water is no longer fresh
              id(tds_baseline) = NAN;
              ESP_LOGW("tds", "Water change older than 24 h, baseline cleared");
            } else if (r > 0) {
              ESP_LOGI("tds", "Water change logged, capturing baseline in 30 min");
              id(script_capture_tds_baseline).execute();
            }
  - platform: homeassistant
    id: ha_water_change_time_2
    entity_id: sensor.aquarium1_wasserwechsel_zeitpunkt
    internal: true
    on_value:
      then:
        - lambda: |-
            int r = aqmon::water_change(x, id(water_change_timestamp_2), id(ha_time).now());
            if (r < 0) {
              id(tds_baseline_2) = NAN;
              ESP_LOGW("tds", "Water change 2 older than 24 h, baseline cleared");
            } else if (r > 0) {
              ESP_LOGI("tds", "Water change 2 logged, capturing baseline in 30 min");
              id(script_capture_tds_baseline_2).execute();
            }

i2c:
  - id: i2c_1
    scl: 17
    sda: 16

# DS18B20 water temperature probes 1 + 2: data -> GPIO21 / D3, both on the same bus
# (one shared 4.7k pull-up to 3V3), told apart by their address
one_wire:
  - platform: gpio
    pin: GPIO21
    id: one_wire_bus

sensor:
  - platform: sht4x
    id: sensor_sht41_1
    i2c_id: i2c_1
    humidity:
      name: Humidity
      id: sensor_sht41_1_humidity
    temperature:
      name: Temperature
      id: sensor_sht41_1_temperature

  - platform: dallas_temp
    id: sensor_water_temperature
    one_wire_id: one_wire_bus
    address: ${water_temp_1_address}
    name: Water Temperature
    update_interval: 30s
    # calibrated 2026-10-30: ice bath and boiling water (Zurich ~410 m -> 98.6 °C)
    filters:
      - calibrate_linear:
          - -2.9 -> 0.0
          - 95.3 -> 98.6

  # second probe: aquarium1 (Plants)
  - platform: dallas_temp
    id: sensor_water_temperature_2
    one_wire_id: one_wire_bus
    address: ${water_temp_2_address}
    name: Water Temperature 2
    update_interval: 30s
    # same correction as probe 1 for now (probe 2 itself not calibrated yet)
    filters:
      - calibrate_linear:
          - -2.9 -> 0.0
          - 95.3 -> 98.6

  # TDS meter v1.0: signal (A) -> GPIO0 / D0 (ADC1_CH0), VCC -> GPIO22 / D4
  - platform: adc
    id: sensor_tds_1_voltage
    pin: GPIO0
    name: TDS Voltage
    attenuation: 12db
    samples: 16
    update_interval: never  # read by script_measure_tds
    accuracy_decimals: 3
    unit_of_measurement: V
    filters:
      - median:
          window_size: 3
          send_every: 3
          send_first_at: 3

  - platform: template
    id: sensor_tds_1
    name: TDS
    unit_of_measurement: ppm
    icon: mdi:water-opacity
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never  # updated by script_measure_tds
    lambda: |-
      float v = id(sensor_tds_1_voltage).state;
      if (isnan(v)) return NAN;
      // temperature compensation to 25 °C (uses water temperature, falls back to 25 °C)
      float t = id(sensor_water_temperature).state;
      if (isnan(t)) t = 25.0f;
      float cv = v / (1.0f + 0.02f * (t - 25.0f));
      float tds = (133.42f * cv * cv * cv - 255.86f * cv * cv + 857.39f * cv) * 0.5f;
      return tds < 0 ? 0.0f : tds;

  - platform: copy
    id: sensor_tds_1_avg_5min
    source_id: sensor_tds_1
    internal: true
    filters:
      - throttle_average: 5min

  - platform: copy
    id: sensor_tds_1_avg_1h
    source_id: sensor_tds_1_avg_5min
    internal: true
    filters:
      - sliding_window_moving_average:
          window_size: 12
          send_every: 1

  # second TDS meter v1.0, aquarium1 (Plants): signal (A) -> GPIO1 / D1 (ADC1_CH1),
  # VCC -> GPIO23 / D5
  - platform: adc
    id: sensor_tds_2_voltage
    pin: GPIO1
    name: TDS 2 Voltage
    attenuation: 12db
    samples: 16
    update_interval: never  # read by script_measure_tds
    accuracy_decimals: 3
    unit_of_measurement: V
    filters:
      - median:
          window_size: 3
          send_every: 3
          send_first_at: 3

  - platform: template
    id: sensor_tds_2
    name: TDS 2
    unit_of_measurement: ppm
    icon: mdi:water-opacity
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never  # updated by script_measure_tds
    lambda: |-
      float v = id(sensor_tds_2_voltage).state;
      if (isnan(v)) return NAN;
      float t = id(sensor_water_temperature_2).state;
      if (isnan(t)) t = 25.0f;
      float cv = v / (1.0f + 0.02f * (t - 25.0f));
      float tds = (133.42f * cv * cv * cv - 255.86f * cv * cv + 857.39f * cv) * 0.5f;
      tds *= ${tds_2_factor};
      return tds < 0 ? 0.0f : tds;

  - platform: copy
    id: sensor_tds_2_avg_5min
    source_id: sensor_tds_2
    internal: true
    filters:
      - throttle_average: 5min

  - platform: copy
    id: sensor_tds_2_avg_1h
    source_id: sensor_tds_2_avg_5min
    internal: true
    filters:
      - sliding_window_moving_average:
          window_size: 12
          send_every: 1

  # comparison of the two tanks (Plants relative to Garnelen), e.g. before moving animals
  - platform: template
    name: TDS Difference
    unit_of_measurement: "%"
    icon: mdi:compare-horizontal
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 5min
    lambda: |-
      float a = id(sensor_tds_1_avg_5min).state;
      float b = id(sensor_tds_2_avg_5min).state;
      if (isnan(a) || isnan(b) || a < 1.0f) return NAN;
      return (b - a) / a * 100.0f;

  - platform: template
    name: Water Temperature Difference
    unit_of_measurement: "°C"
    device_class: temperature
    icon: mdi:compare-horizontal
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 60s
    lambda: |-
      float a = id(sensor_water_temperature).state;
      float b = id(sensor_water_temperature_2).state;
      if (isnan(a) || isnan(b)) return NAN;
      return b - a;

  - platform: template
    id: sensor_tds_1_rise
    name: TDS Rise Since Water Change
    unit_of_measurement: "%"
    icon: mdi:trending-up
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 15min
    lambda: |-
      float base = id(tds_baseline);
      float tds = id(sensor_tds_1_avg_1h).state;
      if (isnan(base) || base < 1.0f || isnan(tds)) return NAN;
      return (tds - base) / base * 100.0f;

  - platform: template
    id: sensor_tds_2_rise
    name: TDS 2 Rise Since Water Change
    unit_of_measurement: "%"
    icon: mdi:trending-up
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 15min
    lambda: |-
      float base = id(tds_baseline_2);
      float tds = id(sensor_tds_2_avg_1h).state;
      if (isnan(base) || base < 1.0f || isnan(tds)) return NAN;
      return (tds - base) / base * 100.0f;

binary_sensor:
  # sudden change within ~1 h: dosing, medication, top-up, probe out of water, ...
  - platform: template
    name: TDS Jump
    device_class: problem
    lambda: |-
      float a5 = id(sensor_tds_1_avg_5min).state;
      float a60 = id(sensor_tds_1_avg_1h).state;
      if (isnan(a5) || isnan(a60) || a60 < 20.0f) return false;
      return fabsf(a5 - a60) / a60 * 100.0f > ${tds_jump_threshold_pct};
    filters:
      - delayed_off: 30min

  - platform: template
    name: Water Change Recommended
    icon: mdi:fishbowl-outline
    lambda: |-
      float rise = id(sensor_tds_1_rise).state;
      return !isnan(rise) && rise > ${tds_water_change_threshold_pct};

  # same for probe 2 (aquarium1, Plants)
  - platform: template
    name: TDS 2 Jump
    device_class: problem
    lambda: |-
      float a5 = id(sensor_tds_2_avg_5min).state;
      float a60 = id(sensor_tds_2_avg_1h).state;
      if (isnan(a5) || isnan(a60) || a60 < 20.0f) return false;
      return fabsf(a5 - a60) / a60 * 100.0f > ${tds_jump_threshold_pct};
    filters:
      - delayed_off: 30min

  - platform: template
    name: Water Change Recommended 2
    icon: mdi:fishbowl-outline
    lambda: |-
      float rise = id(sensor_tds_2_rise).state;
      return !isnan(rise) && rise > ${tds_water_change_threshold_pct};
