substitutions:
  name: aquarium-pumpe
  friendly_name: Aquarium Pumpe
  pump_pin: GPIO25

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key_PUMP
  # Wichtig: Kein automatischer Neustart, wenn Home Assistant nicht erreichbar ist.
  # Sonst würde die Pumpe alle 15 min kurz stoppen.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_pw_PUMP

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Auch bei WLAN-Ausfall nicht neu starten – Pumpe läuft einfach weiter.
  reboot_timeout: 0s
  ap:
    ssid: "${name}-fallback"
    password: !secret fb_pw_PUMP

captive_portal:

# ---------- Pumpe ----------
output:
  - platform: gpio
    pin: ${pump_pin}
    id: pump_output

switch:
  - platform: output
    name: "Filterpumpe"
    id: filter_pump
    output: pump_output
    icon: mdi:pump
    # Nach Stromausfall/Neustart IMMER einschalten (Filterbakterien!)
    restore_mode: ALWAYS_ON

# ---------- Diagnose ----------
sensor:
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s
  - platform: uptime
    name: "Laufzeit"

binary_sensor:
  - platform: status
    name: "Status"

button:
  - platform: restart
    name: "Neustart"