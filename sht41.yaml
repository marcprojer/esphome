# Board: Seeed Studio XIAO ESP32C6 (Seeed Studio)
# Definition: definitions/boards/seeed_xiao_esp32c6/manifest.yaml

esphome:
  name: sht41
  friendly_name: SHT41

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "rUJREhbhaMu+rcNdMp2NNjBuDR/LiyyN+7rwOAofDBw="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: SHT41 Fallback Hotspot
    password: "MX0zKjfKwFcK"

captive_portal:

i2c:
  - id: i2c_1
    scl: 7
    sda: 6

sensor:
  - platform: sht4x
    id: sensor_sht4x_1
    i2c_id: i2c_1
    humidity:
      name: Humidity
      id: sensor_sht4x_1_humidity
    temperature:
      name: Temperature
      id: sensor_sht4x_1_temperature
